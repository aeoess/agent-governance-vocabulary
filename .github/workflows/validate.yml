name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
      - run: npm ci
      # `npm test` is validate + the validator unit tests + the fixture math
      # check. Previously this step ran `npm run validate` alone, so
      # scripts/validators/test-entity-continuity-pdr.js never executed in CI.
      - run: npm test
      # Review evidence, not a gate: the matrix rendered from this pull request
      # and from its base, both with this pull request's generator, and the
      # diff between them. A legitimate crosswalk change is expected to change
      # the matrix, so the diff never fails the job. The render itself is gated
      # by `npm test` above and by validate-trusted.
      - name: checkout base for the matrix diff
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-snapshot
      - name: matrix summary
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/generate-crosswalk-matrix.js --stdout > "$RUNNER_TEMP/pr.md"
          node scripts/generate-crosswalk-matrix.js --stdout --root .base-snapshot > "$RUNNER_TEMP/base.md" || echo "(base did not render)" > "$RUNNER_TEMP/base.md"
          {
            echo "## Crosswalk matrix"
            echo
            echo "PR head \`$HEAD_SHA\`, tested merge tree \`$TESTED_SHA\`, base data \`$BASE_SHA\`. Both data trees use the tested renderer. This is a data diff, not a renderer-code diff or an equality gate."
            echo
            echo '```diff'
            diff -u "$RUNNER_TEMP/base.md" "$RUNNER_TEMP/pr.md" || true
            echo '```'
            echo '<details><summary>Full tested matrix</summary>'
            echo
            cat "$RUNNER_TEMP/pr.md"
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  # Trusted oracle (hostile-review finding 2, 2026-07-17): a PR can edit the
  # validator it is checked by, so this job runs the BASE branch's validator,
  # with dependencies installed from the base lockfile and lifecycle scripts
  # disabled, against the PR's data tree. This is the required context.
  validate-trusted:
    name: validate-trusted
    needs: validate
    # Run even when validate fails, and fail this required context explicitly.
    # A skipped dependent job must not turn failed proposed-code tests green.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: require proposed-tree tests
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: |
          if [ "$VALIDATE_RESULT" != "success" ]; then
            echo "Proposed-tree validation did not pass: $VALIDATE_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: pr-data
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}
          path: trusted
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "20"
      - run: npm ci --ignore-scripts
        working-directory: trusted
      - run: node trusted/scripts/validate-crosswalks.js "$GITHUB_WORKSPACE/pr-data"
      # Same oracle property for the fixture math: the base branch's checker
      # recomputes the PR's fixture values, so a PR cannot land drifted numbers
      # by relaxing the checker in the same commit. Runs unconditionally: the
      # checker is on main as of 6d577d9, and a missing base copy should fail
      # loudly, never skip.
      - name: fixture math (trusted oracle)
        run: node trusted/scripts/validators/check-handoff-decay-fixtures.js "$GITHUB_WORKSPACE/pr-data"
      # Same oracle property for the bilateral_receipt purpose gate (#81). The
      # base branch's checker runs the base branch's validator against the pull
      # request's case data, so a pull request cannot relax the gate in the same
      # commit that changes the cases governing it. The checker resolves its
      # validator and node_modules from its OWN checkout and only the case data
      # from pr-data, which is why it runs correctly against a pr-data tree that
      # never had npm ci.
      #
      # Runs unconditionally, with no existence guard: the checker is on main as
      # of 83c661a7, and a missing base copy should fail loudly rather than skip.
      #
      # SCOPE OF THE GUARANTEE, stated so it is not over-read: this makes the
      # GRADING CODE base-owned. It does not make the gate proof against a
      # hostile pull request, because `pull_request` runs the workflow
      # definition from the pull request, so a change could edit this file and
      # remove the step. Anchoring that needs a required org or enterprise
      # ruleset workflow, which is a governance decision outside this repository.
      - name: bilateral_receipt purpose gate (trusted oracle)
        run: node trusted/scripts/validators/check-bilateral-receipt-purpose-gate.js "$GITHUB_WORKSPACE/pr-data"
      # Same oracle property for the crosswalk matrix. The base branch's
      # generator renders the pull request's crosswalks and fails on any that do
      # not load, or on an output contract failure. The matrix is not committed,
      # so this is the required gate on it. Before the generator took --root
      # (the pull request that introduced this step), the base copy ignored the
      # flag and checked its own tree.
      - name: crosswalk matrix render (trusted oracle)
        run: node trusted/scripts/generate-crosswalk-matrix.js --check --root "$GITHUB_WORKSPACE/pr-data"
