# crosswalk/_bilateral-receipt-missing-purpose.yaml
#
# NEGATIVE FIXTURE (issue #81, Track B). Not a production crosswalk.
#
# `_`-prefixed files are excluded from the main validation pass and asserted
# by checkNegativeFixtures() to produce at least one error. This fixture maps
# canonical `bilateral_receipt` but omits the required `purpose` declaration,
# so it MUST fail validation. Everything else is well-formed, so the only error
# it produces is the missing-purpose error. If this fixture ever passes, the
# registry-purpose rule in scripts/validate-crosswalks.js (or this fixture) has
# drifted. See vocabulary.yaml#signal_types.bilateral_receipt.
system:
  name: Example Non-Conformant System
  repo: https://example.invalid/bilateral-receipt-missing-purpose
signal_types:
  bilateral_receipt:
    canonical: bilateral_receipt
    match: exact
    notes: >
      Intentionally omits the required `purpose` declaration to exercise the
      registry-purpose enforcement rule. A conforming crosswalk would add, for
      example, `purpose: delegation_revocation` or `purpose: [covenant_binding]`.
