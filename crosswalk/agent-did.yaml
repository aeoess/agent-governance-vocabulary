# crosswalk/agent-did.yaml
#
# Maps Agent-DID internal naming to the canonical vocabulary
# defined in vocabulary.yaml v0.2.0.
#
# Agent-DID is an identity layer for AI agents: a specification
# (RFC-001), TypeScript and Python reference SDKs, and framework
# integrations (LangChain JS+PY, CrewAI, Semantic Kernel, Microsoft
# Agent Framework, A2A). It does not issue scored attestations or
# behavioral trust signals. Its scope is verifiable agent identity
# at rest (a did:webvh DID document with typed verification
# relationships) and identity in motion (Ed25519 HTTP message
# signatures following an RFC 9421 profile).
#
# Every claim in this file is pinned to agent-did commit
# d86b54d0533cef7c9545d3509ff9208d98d56949 on `main`. Rows that
# describe specified-but-unimplemented behavior say so explicitly.
#
# Spec: https://github.com/edisonduran/agent-did/blob/d86b54d0533cef7c9545d3509ff9208d98d56949/docs/RFC-001-Agent-DID-Specification.md
# Author: Edison Munoz Duran
# License: Apache-2.0

system:
  name: Agent-DID
  home: https://github.com/edisonduran/agent-did
  repo: https://github.com/edisonduran/agent-did
  spec: https://github.com/edisonduran/agent-did/blob/d86b54d0533cef7c9545d3509ff9208d98d56949/docs/RFC-001-Agent-DID-Specification.md
  source_revision: "d86b54d0533cef7c9545d3509ff9208d98d56949"
  ts_sdk: "@agentdid/sdk 1.0.0-rc.1 at source_revision (not yet on npm; npm latest is 0.2.0, which predates the did:webvh pivot)"
  python_sdk: "agent-did-sdk 1.0.0rc1 at source_revision (not yet on PyPI; PyPI latest is 0.1.0, which predates the did:webvh pivot)"
  spec_version: "RFC-001 0.3-pivot-pattern-on-webvh (status: Stable within the repository for the 1.0.0-rc.1 train; no external standards-body approval)"
  role: >
    Identity layer for AI agents. Verifiable agent identity at rest
    (did:webvh DID document with typed verification relationships and
    an exportable DID log) and identity in motion (Ed25519 HTTP message
    signatures following an RFC 9421 profile). Reference SDKs in
    TypeScript and Python with framework integrations for LangChain,
    CrewAI, Semantic Kernel, Microsoft Agent Framework, and A2A.
  license: Apache-2.0

maintainer:
  name: Edison Munoz Duran
  github: edisonduran
  email: agent.ai.did@gmail.com
  confirmed_at: "2026-11-01"

issuer: "self-issued (did:webvh canonical emission; no central issuer)"

system_attributes:
  signature_capability: classical
  canonicalization_profile: implementation-defined
  hash_family: sha-256

system_attributes_notes: >
    classical: Ed25519 for both message signatures and HTTP message
    signatures. implementation-defined: HTTP signatures sign a base made of
    legacy-formatted component lines for `@request-target`, `host`, `date`,
    `content-digest` and `x-request-nonce`, followed by an RFC 9421
    `"@signature-params"` line (sdk/src/core/AgentIdentity.ts,
    buildHttpSignatureBase). The component lines are not byte-compatible
    with a generic RFC 9421 verifier. DID document
    references hash a recursively key-sorted JSON.stringify serialization
    (sdk/src/crypto/hash.ts, canonicalizeJson). That serializer is not
    claimed to be RFC 8785 JCS. sha-256: `Content-Digest: sha-256=:...:`
    on signed requests and the DID document reference hash.


# ─────────────────────────────────────────────────────────────────
# SIGNAL TYPE MAPPINGS
# Agent-DID is an identity layer, not a scored-attestation issuer.
# Every signal type in vocabulary.yaml has an explicit row. Notes on
# no_mapping rows describe Agent-DID only.
# ─────────────────────────────────────────────────────────────────
signal_types:

  trust_verification:
    canonical: trust_verification
    internal: "DID resolution + verification-relationship binding + Ed25519 signature verification (current and historical keys) + RFC 9421-profile HTTP signature verification"
    match: partial
    notes: >
      Agent-DID covers the cryptographic identity-resolution part of
      trust_verification. A verifier resolves the signing agent's DID,
      requires the signing key to be listed under the verification
      relationship the call needs (for example `assertionMethod`, else
      `IdentityCompositionError` with reason `key_purpose_violation`),
      and verifies the Ed25519 signature. Signatures made under a
      rotated-out key verify only through the explicit historical path.
      A revoked DID fails verification. Divergence from the canonical
      definition: the output is a boolean on cryptographic identity.
      Agent-DID does not emit grades, KYC presence, or principal
      endorsement, and does not issue credentials. No Agent-DID artifact
      carries the verification result as a field; it is the return value
      of `verifySignature`, `verifyHistoricalSignature` and
      `verifyHttpRequestSignature` (sdk/src/core/AgentIdentity.ts), so
      this row declares no evidence state.
    signed_payload_fields:
      # Per-request HTTP signature (identity in motion)
      - Signature-Input  # header - sig1 covering @request-target, host, date, content-digest, x-request-nonce; params created, expires, keyid, alg="ed25519" (all signed via @signature-params)
      - Signature        # header - Ed25519 signature over the signature base
      - Content-Digest   # header - sha-256 of the request body
      - X-Request-Nonce  # header - per-request nonce, a covered component
      - Date             # header - covered component
    resolved_fields:
      # DID document fields the verifier reads (identity at rest)
      - id                    # did:webvh identifier
      - verificationMethod    # Ed25519 keys; rotated-out keys carry `deactivated`
      - authentication
      - assertionMethod
      - capabilityDelegation
      - capabilityInvocation
      - keyAgreement          # agreement only; never accepted for signing
    endpoints:
      ts_sdk_source: "https://github.com/edisonduran/agent-did/tree/d86b54d0533cef7c9545d3509ff9208d98d56949/sdk"
      python_sdk_source: "https://github.com/edisonduran/agent-did/tree/d86b54d0533cef7c9545d3509ff9208d98d56949/sdk-python"
      rfc: "https://github.com/edisonduran/agent-did/blob/d86b54d0533cef7c9545d3509ff9208d98d56949/docs/RFC-001-Agent-DID-Specification.md"
      composition_contract: "https://github.com/edisonduran/agent-did/blob/d86b54d0533cef7c9545d3509ff9208d98d56949/docs/RFC-001-A2A-Identity-Composition-Contract.md"

  entity_continuity:
    canonical: entity_continuity
    internal: "rotateVerificationMethod + did:webvh DID log export/import"
    match: partial
    evidence: inferable
    inferred_from:
      - did:webvh DID log entries (exportDidWebvhHistory)
      - verificationMethod[].deactivated
    inference_basis: >
      Key rotation keeps the DID and appends a revision to the DID log.
      A consumer can recompute that the same DID survived a key change
      by replaying the log, but only when the log was obtained through a
      trusted resolution of the DID. An exported log alone is not
      authenticated: importDidWebvhHistory checks that all entries share
      one DID and that each versionId matches the SCID, and verifies no
      signatures and no hash chain between revisions. Agent-DID does not
      assert continuity as a signed claim.
    notes: >
      Same underlying question (is this still the same agent after a key
      change?), different mechanism. Agent-DID covers key rotation only,
      not host migration or execution-environment swaps, and it does not
      emit a signed continuity proof.

  wallet_state:
    canonical: wallet_state
    match: no_mapping
    notes: "Agent-DID does not read or attest wallet state."

  behavioral_trust:
    canonical: behavioral_trust
    match: no_mapping
    notes: "Agent-DID does not observe or score agent behavior."

  wallet_intelligence:
    canonical: wallet_intelligence
    match: no_mapping
    notes: "Agent-DID does not classify wallet activity."

  reasoning_integrity:
    canonical: reasoning_integrity
    match: no_mapping
    notes: "Agent-DID does not attest model reasoning."

  compliance_risk:
    canonical: compliance_risk
    match: no_mapping
    notes: "Agent-DID does not score compliance exposure."

  governance_attestation:
    canonical: governance_attestation
    match: no_mapping
    notes: >
      Agent-DID does not issue governance attestations. Its refusals
      (IdentityCompositionError, and VerificationBlockedError in the
      Microsoft Agent Framework integration) are verifier-side decisions
      that are not signed or emitted as an artifact about the agent or
      the action.

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: "Agent-DID does not assign grades. Identity verification is binary by design."

  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: "Agent-DID does not emit artifact-bound security posture signals."

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: "Agent-DID does not attest task outcomes."

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: "Agent-DID does not attest settlement events."

  peer_review:
    canonical: peer_review
    match: no_mapping
    notes: "Agent-DID does not issue delegator-signed task-completion attestations."

  completion_ratio:
    canonical: completion_ratio
    match: no_mapping
    notes: "Agent-DID does not compute completion metrics."

  cognitive_attestation:
    canonical: cognitive_attestation
    match: no_mapping
    notes: >
      Agent-DID does not attest reasoning state. The DID document carries
      `agentMetadata.coreModelHash` and `systemPromptHash`, which are
      configuration digests, not commitments about decision-time reasoning.

  bilateral_receipt:
    canonical: bilateral_receipt
    match: no_mapping
    notes: >
      Agent-DID does not issue receipts. Every Agent-DID signature is made
      by one party, and no counterparty signs the same preimage.


# ─────────────────────────────────────────────────────────────────
# DESCRIPTOR DIMENSIONS
# For the one partially mapped identity check (trust_verification).
# ─────────────────────────────────────────────────────────────────
descriptor_dimensions:
  enforcement_class: binding
  validity_temporal: at_processing
  refusal_authority: verifier
  invariant_survival: pre_action
  replay_class: decision_replay
  governed_action_class: read
  notes: |
    The identity check is evaluated by the verifier at request-processing
    time and refuses before the action is accepted. No post-action receipt
    is emitted. replay_class describes audit replay, not anti-replay.
    Re-running verification on a recorded signed request repeats the
    signature check against the key material the verifier resolves at that
    moment. It does not necessarily reproduce the original decision or the
    key's standing at signing time: the result also depends on the
    verifier's clock (created skew, expires), the DID state at processing
    time, and the verifier's own nonce cache. The signed `created`
    parameter is asserted by the signer, not an independent timestamp.
    Anti-replay on the wire is separate: `x-request-nonce` is a covered
    component and `expires` defaults to created + 30 s. governed_action_class
    is `read` for the identity check itself; downstream actions carry their
    own class.


# ─────────────────────────────────────────────────────────────────
# AGENT-DID PRIMITIVES NOT YET IN VOCABULARY
# Identity-layer mechanics and verifier-side rules, listed for
# completeness. Each entry states whether it is implemented in the
# SDK at source_revision or only specified.
# ─────────────────────────────────────────────────────────────────
out_of_vocabulary_primitives:

  per_request_signature:
    implementation_status: implemented
    description: >
      Ed25519 HTTP message signature on each request, following an RFC 9421
      profile: covered components @request-target, host, date,
      content-digest and x-request-nonce, plus the "@signature-params" line,
      so created, expires (default 30 s), keyid as a DID URL and
      alg="ed25519" are signed. Verification requires the Signature-Agent
      header, checks Content-Digest against the body, enforces the
      covered-component set, the nonce header, expiry and created skew
      (default 300 s), requires keyid to be a fragment of the Signature-Agent
      DID, and verifies against an active assertionMethod key. Replay of a
      nonce inside the validity window must be rejected by the verifier's
      own nonce cache. Signatures from @agentdid/sdk <= 0.2.0 and
      agent-did-sdk <= 0.1.0 left the parameters unsigned
      (GHSA-gwjm-x277-ww8p).
    agent_did_symbols:
      ts: [signHttpRequest, verifyHttpRequestSignature]
      python: [sign_http_request, verify_http_request_signature]

  verification_relationship_binding:
    implementation_status: implemented
    description: >
      A signing key must be listed under the verification relationship the
      operation requires. A key listed only under keyAgreement is never
      accepted for signing. A violation raises IdentityCompositionError with
      reason key_purpose_violation.
    agent_did_symbols:
      ts: [assertKeyPurpose, assertSigningPurpose, IdentityCompositionError]

  key_rotation_and_revocation:
    implementation_status: implemented
    description: >
      rotateVerificationMethod adds a new Ed25519 key, marks the previous
      one `deactivated`, and keeps the DID. verifyHistoricalSignature accepts
      signatures from a rotated-out key only through that explicit path.
      revokeDid makes later verification fail. Every change is recorded in
      the did:webvh DID log, which can be exported and re-imported.
    agent_did_symbols:
      ts: [rotateVerificationMethod, verifyHistoricalSignature, revokeDid, exportDidWebvhHistory, importDidWebvhHistory]
      python: [rotate_verification_method, verify_historical_signature, revoke_did, export_did_webvh_history]

  rotation_state_machine:
    implementation_status: specified_not_implemented
    description: >
      Composition contract section 4: planned overlap (24 h default, 7 d
      ceiling) and emergency revocation with a 1 h
      max_emergency_propagation_window. The reason codes
      rotation_window_closed and emergency_revoked are declared in the SDK
      types but are not raised at source_revision.

  identity_composition_contract:
    implementation_status: specified_not_implemented
    description: >
      Normative verifier rule (composition contract section 2): the
      per-request keyid must also be published in the agent's Agent Card,
      and a mismatch is a typed rejection. Only the verification-relationship
      half ships in the SDK (see verification_relationship_binding). Agent
      Card signing and the card-to-request cross-check are specified and not
      implemented. Conformance fixtures are tracked in
      https://github.com/edisonduran/agent-did/issues/43.

  verified_handoff_gate:
    implementation_status: implemented
    description: >
      Microsoft Agent Framework integration: add_verified_handoff inserts a
      verifier executor between two workflow executors. It verifies the
      Ed25519 signature on the handed-off message with action-class TTLs
      (irreversible 30 s, compensable 120 s, reversible 300 s) and raises
      VerificationBlockedError by default rather than silently not routing.
      Known limit: resuming a workflow from a checkpoint taken after the
      verifier delivers the already-verified payload without re-verification,
      reproduced on agent-framework 1.0.1
      (https://github.com/microsoft/agent-framework/issues/4842#issuecomment-6559162642).
    agent_did_symbols:
      python: [add_verified_handoff, VerificationBlockedError]


# ─────────────────────────────────────────────────────────────────
# CROSSWALK SUMMARY
# ─────────────────────────────────────────────────────────────────
summary:
  signal_types_exact: 0
  signal_types_partial: 2          # trust_verification, entity_continuity
  signal_types_no_mapping: 14
  out_of_vocabulary_primitives: 6  # 4 implemented, 2 specified_not_implemented

  protocol_version_pinning: >
    All mappings hold for agent-did at source_revision
    d86b54d0533cef7c9545d3509ff9208d98d56949. The registry packages
    (npm @agentdid/sdk 0.2.0, PyPI agent-did-sdk 0.1.0) predate the
    did:webvh pivot and do not match this file. This file will be
    re-pinned when 1.0.0-rc.1 is published to both registries.

  related_threads:
    - "Composition contract and conformance fixtures: https://github.com/edisonduran/agent-did/issues/30"
    - "Workflow-edge identity in Microsoft Agent Framework: https://github.com/microsoft/agent-framework/issues/4842"


crosswalk_metadata:
  authored_by: "@edisonduran"
  vocabulary_version: "0.2.0"
  last_reviewed: "2026-11-01"
  change_log:
    - date: "2026-11-01"
      summary: >
        Refresh for vocabulary 0.2.0 and correction of the 2026-04-30 file.
        Added explicit rows for completion_ratio, cognitive_attestation and
        bilateral_receipt, added system_attributes, and rewrote no_mapping
        notes to describe Agent-DID only. Corrections: the DID method is
        did:webvh (not did:key/did:web); the SDK symbols are the real ones;
        the HTTP signature expiry default is 30 s (not 5 min); the nonce is a
        covered header (not a signature parameter); replay_class changes from
        no_replay to decision_replay because the old value described
        anti-replay rather than audit replay. Agent Card and the
        rotation state machine are now marked specified_not_implemented
        instead of being described as shipped. Pinned to the revision that
        fixes GHSA-gwjm-x277-ww8p (HTTP signature parameters now signed).
        Review corrections: trust_verification declares no evidence state
        (no artifact carries the result), replay notes limit replay to the
        signature check, and the entity_continuity inference requires a
        trusted resolution of the DID log.
