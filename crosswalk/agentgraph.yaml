# crosswalk/agentgraph.yaml
#
# ALIAS RECORD (dual-carry). AgentGraph rebranded to AgentAvow. The
# issuer identity is unchanged - same DID (did:web:agentgraph.co), same
# signing kid (agentgraph-security-v1), same endpoint hosts. The live
# crosswalk now lives at crosswalk/agentavow.yaml.
#
# This file is retained as an alias so consumers keyed on the previous
# `agentgraph` name still resolve to the same issuer during the
# transition window. Its `signal_types` block has been moved to
# crosswalk/agentavow.yaml so the issuer is not double-counted in the
# crosswalk matrix or read as a second independent implementation of
# `security_posture`.
#
# Reversibility: to cut to `agentavow`-only, delete this file. To
# revert the rebrand entirely, restore this file from git history and
# remove crosswalk/agentavow.yaml.

system:
  name: AgentGraph
  renamed_to: AgentAvow
  home: https://agentgraph.co
  repo: https://github.com/agentgraph-co/agentgraph

license: Apache-2.0

maintainer:
  github: kenneives
  confirmed_at: "2026-08-07"

issuer: "did:web:agentgraph.co"

alias:
  status: superseded
  superseded_by: crosswalk/agentavow.yaml
  current_name: AgentAvow
  previous_name: AgentGraph
  issuer_did: did:web:agentgraph.co    # unchanged across the rebrand
  signing_kid: agentgraph-security-v1  # unchanged; verifiers keep pinning this
  note: >
    See crosswalk/agentavow.yaml for the full security_posture mapping,
    signed-payload fields, endpoints, and descriptor dimensions. Both
    the `agentgraph` and `agentavow` keys resolve to
    did:web:agentgraph.co during dual-carry.
