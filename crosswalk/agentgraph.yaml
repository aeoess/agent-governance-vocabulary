  last_reviewed: "2026-09-30"
  related_artifacts:
    - "https://agentgraph.co/.well-known/cte-test-vectors.json"  # CTEF v0.3.1 frozen wire format
    - "https://agentgraph.co/.well-known/interop-harness.json"   # 8-impl byte-match receipt aggregator
    - "https://agentgraph.co/.well-known/jwks.json"              # public key set
    - "https://agentgraph.co/.well-known/did.json"               # did:web:agentgraph.co document
  ctef_substrate_evidence:
    # Counts per interop-harness.json, `as_of` 2026-05-05.
    implementations_byte_match_validated: 9
    independent_canonicalizers: 8
    reader_runnable_verifier_scripts: 2
    cross_repository_receipt_mirrors: 2
    fail_closed_negative_paths: 2
    spec_anchor_commit: "AgentAvow/AgentAvow@8b44390"
  next_revisions:
    - "Map the package, skill and MCP-endpoint surfaces (subject identifiers and per-surface digests) in a separate PR."
    - "Decide a mapping for the opt-in behavioral check in a separate PR. It is outside the signed payload today, so it stays unmapped until it is signed."
    - "Re-verify the Dominion Observatory delegation notes, or remove them."
    - "Populate maintenance_health crosswalk row (currently no_mapping) once the v0.4 §6.x.y claim_subtype proposal from openclaw-skill-quality-analyzer / Miaoqu AI is adopted."
