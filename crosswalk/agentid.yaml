# crosswalk/agentid.yaml
#
# Maps AgentID's internal naming and verify-endpoint payload to the
# canonical vocabulary defined in vocabulary.yaml v0.2.0.
#
# AgentID is the identity layer for AI agents. Each agent holds two
# equivalent DID forms: `did:web:getagentid.dev:agent:<agent_id>`
# (the form `/verify` emits as `did` / `subject_did`) and
# `did:agentid:<agent_id>` (emitted as `did_agentid`). The two are
# cross-linked via `alsoKnownAs` in the DID document and resolve
# through the same self-hosted DID resolution endpoint. Ed25519 signatures
# over the receipt compound digest are publicly verifiable against the
# JWKS. Listed in `issuers_in_production` for `trust_verification` and
# `completion_ratio`.
#
# DID method spec: https://getagentid.dev/specs/did-method-agentid-v1.0
# (canonical source:
# https://github.com/haroldmalikfrimpong-ops/agentid/blob/main/specs/did-method-agentid-v1.0.md).
# Endpoint surface aligned with CTEF v0.3.1; the live field list below
# was re-read against `/verify` on 2026-09-30.

system:
  name: AgentID
  home: https://getagentid.dev
  repo: https://github.com/haroldmalikfrimpong-ops/agentid
  spec: https://getagentid.dev/specs/did-method-agentid-v1.0
  jwks: https://getagentid.dev/.well-known/jwks.json
  role: >
    Identity layer for AI agents. Issues cryptographic identity
    attestations for agents identified by
    `did:web:getagentid.dev:agent:<agent_id>` and the equivalent
    `did:agentid:<agent_id>` (method spec v1.0), with Ed25519
    signatures (kid `agentid-2026-03`, alg `EdDSA`) over the receipt
    compound digest. Verify endpoint emits `claim_type: "identity"`
    aligned with the CTEF v0.3.1 four-layer claim split, including
    `subject_did` for principal binding and a compound digest signed
    over the publicly verifiable surface. Trust levels are integers
    1-4, labelled L1-L4 (`trust_level_label`, e.g. `L2 — Verified`).
  spec_alignment:
    ctef_version: "v0.3.1"
    canonicalization: "implementation-defined (staged): data_hash = sha256hex(JSON.stringify({action, agent_id, data, timestamp}) in insertion order); hash_receipt digest = sha256hex(JCS RFC 8785 of the hash receipt); compound_digest = sha256hex(hash_receipt_digest || memo_digest || action_ref || timestamp) as ASCII hex/string concatenation; Ed25519 signs the raw 32 digest bytes. JCS covers one stage only."
    signature_alg: "EdDSA / Ed25519 (raw digest bytes)"
    did_resolution: "self-hosted DID resolution HTTP(S) endpoint (did:web + did:agentid) — GET https://getagentid.dev/1.0/identifiers/{did}; W3C did-extensions registration pending (w3c/did-extensions#762)"

license: Apache-2.0

maintainer:
  github: haroldmalikfrimpong-ops
  confirmed_at: "2026-09-30"

# Registry key; unchanged pending discussion with the registry maintainer.
# The issuer DID document now resolves at
# https://getagentid.dev/.well-known/did.json (`id: did:web:getagentid.dev`,
# verificationMethod `#agentid-2026-03` = the JWKS key). The discovery
# manifest at https://getagentid.dev/.well-known/agentid.json declares
# `platform_did: did:web:getagentid.dev`.
issuer: "did:agentid:agentid-issuer"

system_attributes:
  # The signing pipeline is staged (JSON.stringify -> JCS -> hex concat ->
  # raw-digest Ed25519); JCS applies to the hash receipt only, so the
  # whole-pipeline profile is implementation-defined. Stages are spelled
  # out under system.spec_alignment.canonicalization.
  signature_capability: classical
  canonicalization_profile: implementation-defined
  hash_family: sha-256


# ─────────────────────────────────────────────────
# SIGNAL TYPE MAPPINGS
# ─────────────────────────────────────────────────
signal_types:

  trust_verification:
    canonical: trust_verification
    internal: "Identity gate + Ed25519-signed compound digest on /verify"
    match: exact
    notes: >
      AgentID's primary signal. Each registered agent holds an Ed25519
      public key bound at registration and is identified by
      `did:web:getagentid.dev:agent:<agent_id>`, with
      `did:agentid:<agent_id>` as an equivalent alias (the per-agent
      DID document at `/agent/<agent_id>/did.json` lists the alias in
      `alsoKnownAs`; the resolver at `/1.0/identifiers/{did}` accepts
      either form and returns a DIF-shaped `didDocument` +
      `didResolutionMetadata`). Verification returns the canonical
      `claim_type: "identity"` envelope with `did`, `subject_did`
      (both the did:web form) and `did_agentid`, an Ed25519 signature
      over the compound digest, scarring score, incident history, and
      trust-level metadata (integer 1-4, labelled L1-L4). The
      `compound_digest_signature` field is an internal HMAC-SHA256
      tamper-evidence artifact and is not part of the publicly
      verifiable surface — public verification uses
      `compound_digest_ed25519_signature` (64 bytes) over the raw 32
      bytes of `compound_digest` against the JWKS at
      `/.well-known/jwks.json`. The digest construction is published
      in the discovery manifest (`receipt_format.compound_digest`:
      SHA-256 over hash(HashReceipt) + hash(BlockchainMemo) +
      action_ref + timestamp). External DIDs (`did:web` on other
      hosts, `did:key`, etc.) resolve through the `identity_gate`
      (`resolution_source: "external"`) — an unresolvable external
      identity returns `verified: false, identity_gate: "failed"`
      independent of any other score. An unknown local `agent_id`
      returns `verified: false` with `message: "Agent not found"` and
      no `identity_gate` or `claim_type` field.
    # Fields emitted on the /verify response. The Ed25519 signature
    # covers `receipt.compound_digest` (raw bytes); see the manifest
    # `receipt_format` for which inputs the digest binds.
    # Fields committed by the Ed25519-signed compound digest, reproduced
    # from the construction in the issuer code (lib/receipts.ts):
    #   data_hash       = sha256hex(JSON.stringify({action, agent_id, data, timestamp}))
    #                     data = {verified, trust_level, trust_level_label,
    #                             certificate_valid, verified_by[, context_epoch, context_hash]}
    #   hash_receipt    = {receipt_id, action, agent_id, timestamp, data_hash,
    #                      signature, verification_url}
    #   compound_digest = sha256hex(sha256hex(JCS(hash_receipt))
    #                               || sha256hex(memo | "no-blockchain-receipt")
    #                               || action_ref || timestamp)
    #   signature       = Ed25519(raw 32 bytes of compound_digest), kid agentid-2026-03
    # `receipt.hash.signature` is an HMAC internal to the issuer; it is
    # inside the JCS'd hash receipt, hence committed, but not independently
    # verifiable. The /verify hot path skips the on-chain memo, so the memo
    # digest is sha256hex("no-blockchain-receipt") unless the receipt was
    # anchored via /publish-onchain.
    signed_payload_fields:
      - agent_id                                        # via data_hash and hash_receipt.agent_id
      - verified                                        # via data_hash (data.verified)
      - trust_level                                     # via data_hash (data.trust_level), integer 1-4
      - trust_level_label                               # via data_hash
      - certificate_valid                               # via data_hash
      - receipt.hash.receipt_id                         # string — UUID
      - receipt.hash.action                             # string — "verification"
      - receipt.hash.agent_id                           # string
      - receipt.hash.timestamp                          # ISO 8601 — also the trailing component of the compound preimage
      - receipt.hash.data_hash                          # string — SHA-256 hex over {action, agent_id, data, timestamp}
      - receipt.hash.signature                          # string — issuer HMAC, committed via JCS(hash_receipt), not publicly verifiable
      - receipt.hash.verification_url                   # string — https://getagentid.dev/proof/{receipt_id}
      - receipt.action_ref                              # string — component of the compound preimage (see note below)
      - receipt.context_epoch                           # integer | null — committed via data_hash only when the caller supplies it
    # Returned on `/verify` but NOT committed by the compound digest.
    # Treat as response metadata; do not rely on the signature for them.
    response_only_fields:
      - claim_type
      - did
      - subject_did
      - did_agentid
      - identity_gate
      - resolution_source
      - resolved_at
      - active
      - supported_key_types
      - scarring_score
      - negative_signals
      - resolved_signals
      - incident_history
      - behaviour.risk_score
      - behaviour.warnings
      - receipt.attestation_level
      - receipt.policy_hash
      - receipt.previous_policy_hash
      - receipt.compound_digest                         # the digest itself (signature target, not a covered field)
      - receipt.compound_digest_ed25519_signature       # the signature
      - interaction_pattern.*
      - context_continuity.*
    # `receipt.action_ref` on `/verify` echoes a caller-supplied
    # `action_ref` when one is provided; otherwise it falls back to
    # the receipt UUID (equal to `receipt.hash.receipt_id`). The
    # canonical action_ref construction —
    # SHA-256(agent_id || action_type || scope || int64_be(ts_ms)),
    # raw concatenation — is produced by the gateway
    # `verifier-attestation` route, not by `/verify`. Do not treat the
    # `/verify` value as the canonical form unless the caller supplied it.
    endpoints:
      verify:        "POST https://getagentid.dev/api/v1/agents/verify"
      register:      "POST https://getagentid.dev/api/v1/agents/register"
      jwks:          "https://getagentid.dev/.well-known/jwks.json"
      registry:      "https://getagentid.dev/registry"
      did_document:  "GET https://getagentid.dev/agent/{agent_id}/did.json"
      did_resolver:  "GET https://getagentid.dev/1.0/identifiers/{did}"   # did:agentid:<agent_id> | did:web:getagentid.dev:agent:<agent_id> | did:web:getagentid.dev
      issuer_did:    "GET https://getagentid.dev/.well-known/did.json"
      certificate:   "GET https://getagentid.dev/api/v1/agents/{agent_id}/certificate"
      credibility_packet: "GET https://getagentid.dev/api/v1/agents/credibility-packet?agent_id={agent_id}"
      trust_header:  "GET https://getagentid.dev/api/v1/agents/trust-header?agent_id={agent_id}"
      merkle_root:   "GET https://getagentid.dev/api/v1/agents/merkle-root?agent_id={agent_id}"
      proof:         "GET https://getagentid.dev/proof/{receipt_id}"
      manifest:      "GET https://getagentid.dev/.well-known/agentid.json"
      did_method_spec: "https://getagentid.dev/specs/did-method-agentid-v1.0"

  completion_ratio:
    canonical: completion_ratio
    internal: "interaction_pattern.completion_ratio (rolling 180d)"
    match: exact
    notes: >
      Strict task-level completed/total over a rolling 180-day window,
      computed at verification time and emitted as a non-blocking
      sub-block of the `/verify` response under `interaction_pattern`.
      Cited as one of two production implementations in
      `vocabulary.yaml` (alongside APS at default 90d).
    # Not committed by the compound digest (see trust_verification note);
    # emitted as response metadata on `/verify`.
    response_only_fields:
      - interaction_pattern.completion_ratio                       # number 0..1 (up to three decimals; emitted as integer 1 when exact)
      - interaction_pattern.relationship_to_completion_ratio       # number — completion conditional on partner-counter
      - interaction_pattern.sequence_depth                          # integer — interaction chain length
      - interaction_pattern.co_signed_outputs                       # integer — count of co-signed deliverables
      - interaction_pattern.evaluation_window                       # string — "180d"
    requires:
      observation_window: "180d"
      completion_ratio_method: "strict"
    endpoints:
      verify: "POST https://getagentid.dev/api/v1/agents/verify"

  entity_continuity:
    canonical: entity_continuity
    internal: "context_continuity (auto-detected, session_boundary)"
    match: partial
    divergence: >
      AgentID's `context_continuity` block scores cross-session
      continuity (model-swap, prompt-change, memory-consolidation
      signals) at the session boundary, returned as a non-blocking
      annotation on `/verify`. It is not a per-action operational
      trace (PDR's domain) and is not a soulbound-anchor receipt
      (SBR's domain). Same canonical primitive — "is this still the
      same agent?" — different evaluation surface.
    # Not committed by the compound digest; response metadata on `/verify`.
    response_only_fields:
      - context_continuity.score                # 0-100
      - context_continuity.auto_context_epoch   # detected epoch boundary
      - context_continuity.signals              # array of continuity signals
      - context_continuity.measurement_point    # "session_boundary"

  behavioral_trust:
    canonical: behavioral_trust
    match: partial
    divergence: >
      AgentID returns a `trust_score` and `trust_level` on `/verify`,
      but they are explicitly **informational** — they do not gate
      verification. The composite is anomaly-driven (negative_signals,
      resolved_signals, scarring_score) rather than a multi-dimensional
      peer-endorsement score. RNWY (`rnwy-trust-v2`) and MolTrust
      ship the canonical multi-dimensional behavioral_trust signal.

  peer_review:
    canonical: peer_review
    match: no_mapping
    notes: >
      AgentID does not issue per-task delegator-signed peer-review
      attestations. Primary issuers: Logpose, RNWY.

  wallet_state:
    canonical: wallet_state
    match: no_mapping
    notes: >
      AgentID supports cryptographic wallet binding to a DID
      (`bind-wallet` endpoint) but does not attest wallet balances or
      on-chain holdings. Primary issuer: InsumerAPI.

  governance_attestation:
    canonical: governance_attestation
    match: no_mapping
    notes: >
      AgentID issues identity attestations, not delegation-chain
      authority attestations. Primary issuers: AgentNexus, Nobulex,
      SINT, APS.

  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: >
      AgentID does not produce repo/artifact-bound security signals.
      Primary issuer: AgentGraph (registry key `agentgraph`; rebranding
      as AgentAvow per aeoess/agent-governance-vocabulary#82) — signed
      subject is `github:owner/repo`.

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: >
      AgentID does not anchor outcome receipts. Primary issuer: SAR.

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: >
      Distinct primitive from AgentID's `trust_level` enum.
      Primary issuer: APS.

  compliance_risk:
    canonical: compliance_risk
    match: no_mapping
    notes: >
      AgentID does not perform sanctions / OFAC / regulatory screening.
      Status `reserved` upstream with `issuers_in_production: []`.

  wallet_intelligence:
    canonical: wallet_intelligence
    match: no_mapping
    notes: >
      Operator-level wallet classification is not in scope for AgentID.

  reasoning_integrity:
    canonical: reasoning_integrity
    match: no_mapping
    notes: >
      AgentID does not attest model-reasoning artifacts.

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: >
      AgentID does not issue task-outcome attestations.
      Status `reserved` upstream; AgentID does not currently produce
      this signal.

  cognitive_attestation:
    canonical: cognitive_attestation
    match: no_mapping
    notes: >
      Status `reserved` upstream. AgentID attests identity, key
      binding and behavioural anomaly state; it makes no claim about
      the reasoning content an agent committed to at decision time and
      carries no reduction map or faithfulness scope.

  bilateral_receipt:
    canonical: bilateral_receipt
    match: no_mapping
    notes: >
      Status `reserved` upstream. AgentID verification receipts are
      single-party (issuer-signed, `attestation_level: "self-issued"`)
      and carry no counterparty signature or registered `purpose`.
      `interaction_pattern.co_signed_outputs` is a count, not a
      two-party receipt artifact.

  decision_lineage:
    canonical: decision_lineage
    match: no_mapping
    notes: >
      AgentID does not issue per-action operational-trace attestations
      (PDR's domain). The receipt `policy_hash` /
      `previous_policy_hash` chain links policy state, not decisions.

  divergence_signal:
    canonical: divergence_signal
    match: no_mapping
    notes: >
      `behaviour.warnings[]` on `/verify` reports anomalies against an
      internal baseline (e.g. `frequency_spike` with `baseline_value`),
      but there is no declared `baseline_revision` and the measurement
      is not emitted as a first-class quantitative divergence signal.

  trust_velocity:
    canonical: trust_velocity
    match: no_mapping
    notes: >
      AgentID emits a snapshot `trust_score` / `trust_level`; no
      rate-of-change over a declared observation_window is issued.


# ─────────────────────────────────────────────────
# DESCRIPTOR DIMENSION MAPPINGS
# ─────────────────────────────────────────────────
descriptor_dimensions:

  trust_verification:
    enforcement_class: refusal_authority
    enforcement_notes: >
      The `identity_gate` is refusal-bearing for resolved identities:
      an unresolvable external DID causes `/verify` to return
      `verified: false, identity_gate: "failed"` regardless of any
      other signal value. An unknown local `agent_id` returns
      `verified: false` with `message: "Agent not found"` and no
      `identity_gate` field. In both cases AgentID asserts that
      downstream consumers MUST reject attestations referencing a
      DID that does not verify, independent of trust score.

    validity_temporal: at_issuance
    validity_notes: >
      Each `/verify` response carries `resolved_at` plus a fresh
      compound digest. Validity is a snapshot at the time of
      verification; the receipt is replayable but the underlying
      registry state can change.

    refusal_authority: issuer
    refusal_notes: >
      AgentID is the source-of-truth for identity state under
      `did:web:getagentid.dev:agent:<agent_id>` / `did:agentid:<agent_id>`.
      Revocation, key rotation, and incident scarring update the
      canonical record, and subsequent verifications reflect the
      updated state.

    invariant_survival: pre_action
    invariant_notes: >
      Identity verification is a pre-action gate — it runs before the
      consuming agent or policy permits a delegation, payment, or
      cross-agent call.

    replay_class: decision_replay
    replay_notes: >
      Given the receipt envelope + JWKS, any verifier can replay the
      identity decision offline by re-checking the Ed25519 signature
      over the raw `compound_digest` bytes. Full replay of the
      underlying registry state is not provided — that requires
      re-querying the issuer.

    governed_action_class: ["read", "write", "delegate", "compose"]

  completion_ratio:
    enforcement_class: advisory
    enforcement_notes: >
      Returned as a non-blocking sub-block of `/verify`. AgentID
      reports the ratio; refusal authority lives with the consuming
      agent or policy layer.

    validity_temporal: windowed
    validity_notes: >
      Strict completed/total over a rolling 180-day `evaluation_window`
      computed at verify-time. See vocabulary.yaml `observation_window`
      and `completion_ratio_method` extensions for cross-issuer
      comparability.

    refusal_authority: consumer_policy
    invariant_survival: post_action
    replay_class: fingerprint_only
    replay_notes: >
      The ratio itself is replayable from the issuer's canonical
      output; the underlying per-task interaction records that
      contributed to the count are not exposed in the receipt.

    governed_action_class: ["delegate"]


