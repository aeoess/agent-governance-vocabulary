# crosswalk/ain-wrp.yaml
#
# Drafted by @aeoess from the text of draft-tanase-ain-authoritative-resolution-00
# (2026-09-18). Corrected and confirmed by the draft's author, Elena Tănase
# (AIDAXIA Ltd.), by email on 2026-10-05 and 2026-10-06. The rows track an
# individual Internet-Draft at -00 and may change as the draft evolves.
#
# AIN-WRP resolves a persistent Agent Identity Number (AIN) and correlates
# identity, lifecycle, operator, mandate, endpoint and restriction assertions
# from competent sources before an interaction begins. It does not score agents,
# does not create authority, and leaves the decision to the gateway's local policy.

system:
  name: AIN-WRP
  home: https://datatracker.ietf.org/doc/draft-tanase-ain-authoritative-resolution/
  spec: https://datatracker.ietf.org/doc/draft-tanase-ain-authoritative-resolution/
  spec_version: "draft-tanase-ain-authoritative-resolution-00 (2026-09-18)"
  role: >
    Authoritative resolution of persistent digital agent identities and
    pre-interaction verification across independent administrative domains.
    Produces a relationship-specific Pre-Interaction Trust State, optionally
    conveyed as a signed, time-limited State Proof, which a gateway or relying
    party consumes under its own policy.

license: Apache-2.0

maintainer:
  name: Elena Tănase
  affiliation: AIDAXIA Ltd.
  confirmed_at: "2026-10-06"

signal_types:

  trust_verification:
    canonical: trust_verification
    internal: "Authoritative resolution of an AIN (section 7) plus optional proof of control (section 9)"
    match: partial
    notes: >
      Covers identity-layer verification: current lifecycle state (section 8),
      operator binding, verification material, and challenge-response proof of control,
      each from a source whose competence is validated (section 7.3). It does
      not assign grades or KYC tiers. Proof of control establishes key
      possession only, not mandate or permission (section 9).

  entity_continuity:
    canonical: entity_continuity
    internal: "AIN persistence and non-reassignment (section 6.3), identity continuity (Appendix B.5)"
    match: partial
    notes: >
      An AIN is never reassigned, and key rotation, suspension and revocation do
      not change it. Section 6.3 says a resolver SHOULD retain enough tombstone information
      to distinguish a known revoked AIN from one that was never issued. Continuity rests on the registry record and a
      registration profile's invariants, not on a cryptographic proof carried
      across the change. Appendix B.5 is non-normative in -00.

  governance_attestation:
    canonical: governance_attestation
    internal: "Pre-Interaction State Proof (sections 3, 10.6, Appendix B.1)"
    match: false_analog
    notes: >
      A signed, time-limited statement of the evaluated state for one
      relationship and audience, which can carry RESTRICT, DENY or REVIEW. It
      is not a statement that an agent satisfied a declared requirement, and
      section 10.4 says it must not be read as reputation or universal
      authorisation. It is close enough in shape (signed, time-limited, about
      an agent) that a consumer could wire it up as governance_attestation,
      which is why this row is false_analog and not no_mapping. It states
      whether the decision came from the correlation service or the gateway
      (section 10.5). Serialization and consumption semantics are deferred past
      -00.

  behavioral_trust:
    canonical: behavioral_trust
    match: no_mapping
    notes: >
      Out of scope by design. Section 4.2 excludes a universal trust score,
      risk score or reputation methodology.

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: "Same non-goal as behavioral_trust."

context_dimensions:

  counterparty_standing:
    canonical: counterparty_standing
    internal: "Pre-Interaction Trust State (section 10.4)"
    match: partial
    notes: >
      Relationship-specific state for a proposed interaction. The Trust State
      covers both participants and the relationship, not only the
      counterparty, including authoritative identity or endpoint binding. It carries
      verified state and restrictions, not maturity or prior-completion signals.

descriptor_dimensions:
  refusal_authority: shared   # the gateway decides admission under local policy, but local policy cannot override a mandatory prohibition from a competent source (section 5 and section 10.4, Table 4)
  validity_temporal: at_acceptance     # evaluated before the operational protocol begins, with optional re-evaluation triggers (section 12)

gaps:
  - area: "source competence (section 7.3)"
    notes: >
      AIN-WRP requires the relying party to establish that the source of an
      assertion, including the issuer of a mandate, is competent for that
      principal, scope and domain. The current vocabulary has no canonical
      term for source competence.
