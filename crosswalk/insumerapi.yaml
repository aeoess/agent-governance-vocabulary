  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: "InsumerAPI does not issue security_posture. It issues only wallet_state."

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: "InsumerAPI does not issue job_performance. It issues only wallet_state."

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: "InsumerAPI does not issue settlement_witness. It issues only wallet_state."

  governance_attestation:
    canonical: governance_attestation
    match: no_mapping
    notes: "InsumerAPI does not issue governance_attestation. It issues only wallet_state. The closest InsumerAPI output is a signed `met` on an erc7710_delegation or erc8004_agent condition. It reports whether a delegation the principal signed to the wallet is currently valid and was unrevoked at the anchored block, or whether the wallet owns or is bound to an ERC-8004 agent ID, not that an agent or action satisfied a declared governance requirement, so it is not governance_attestation."

  peer_review:
    canonical: peer_review
    match: no_mapping
    notes: "InsumerAPI does not issue peer_review. It issues only wallet_state."

  completion_ratio:
    canonical: completion_ratio
    match: no_mapping
    notes: "InsumerAPI does not issue completion_ratio. It issues only wallet_state."

  entity_continuity:
    canonical: entity_continuity
    match: no_mapping
    notes: "InsumerAPI does not issue entity_continuity. It issues only wallet_state."

  cognitive_attestation:
    canonical: cognitive_attestation
    match: no_mapping
    notes: "InsumerAPI does not issue cognitive_attestation. It issues only wallet_state."

  bilateral_receipt:
    canonical: bilateral_receipt
    match: no_mapping
    notes: "InsumerAPI does not issue bilateral_receipt. It issues only wallet_state. Each of the three signed shapes in this file (the raw and JWT forms of /v1/attest and the trust profile) is signed by the issuer alone, ES256 plus the issuer's ML-DSA-65 signature. No counterparty signs the preimage, so the two-signature property is absent. An erc7710_delegation result evaluates a delegation the principal signed, but that EIP-712 signature covers the delegation, not InsumerAPI's preimage, and the result carries the delegation's hash rather than the signature. account_code `eip7702` results describe code delegation, not a delegation receipt."

# ─────────────────────────────────────────────────
# DESCRIPTOR DIMENSION MAPPINGS
# How InsumerAPI's wallet_state attestations map onto each descriptor
# dimension. Only wallet_state has descriptors here because it is the
# only signal type InsumerAPI issues.
# ─────────────────────────────────────────────────
descriptor_dimensions:

  wallet_state:
    enforcement_class: advisory
    enforcement_notes: "InsumerAPI produces signed evidence; the consuming agent or policy layer decides whether to permit, deny, or step up. Refusal authority lives with the consumer, not the issuer."

    validity_temporal: at_issuance
    validity_notes: "Each attestation carries block-level freshness context (a per-condition chain anchor for /v1/attest: `blockNumber` + `blockTimestamp` on EVM, `slot`, `ledgerIndex`, `blockHeight` or `checkpointSequence` elsewhere; per-check anchors plus `profiledAt` for /v1/trust) and an explicit expiry. Validity is a snapshot at issuance; on-chain state can change after the attestation is minted. Default TTL 30 minutes for cacheability, 5 minutes when the request contains an erc7710_delegation condition."

    refusal_authority: consumer_policy
    refusal_notes: "InsumerAPI never refuses an action; it reports the observed state. Consumer-side composition policy (e.g., SkyeProfile orchestrator or direct integration) decides how to weight the signal."

    invariant_survival: pre_action
    invariant_notes: "Attestations are used before an action (payment, delegation, gated access). Post-action state is the province of settlement_witness (SAR), not wallet_state."

    replay_class: decision_replay
    replay_notes: "Given the signed envelope, the JWKS and the block anchor, any verifier can check offline that the signed `pass` / `met` values, and the conditions they answer, are intact and bound to the signed anchor: `decision_replay`. Merkle-proof mode (`proof: \"merkle\"`) adds an EIP-1186 proof against the block header on the EVM chains whose node serves proofs (27 of 31 as of 2026-10-29). A proof establishes the proven field. It gives `full_replay` only where that field, with what the record signs, is everything `met` depends on; otherwise the condition stays `decision_replay`. (1) token_balance and ratio_to_amount, native balances included: `full_replay` from a v1 record, which signs the token's decimals beside the display-unit threshold (for ratio_to_amount, threshold = multiple * amount, all signed). A v2 record omits decimals, so comparing the proven raw balance with the threshold needs the token's decimals from outside the record, and from the record alone the condition stays `decision_replay`. The EVM token checks in a trust profile are presence checks (`gt` 0), so decimals do not matter there, and they replay in full. An ERC-20 proof shows the value at the balance slot the record names; a verifier that doubts that slot checks the token's storage layout. (2) account_code: the proof establishes the account's codeHash, and the code itself is never returned. `expect: \"none\"` and `expect: \"eip7702\"` with a named `delegate` are `full_replay`, because the expected hash is known (empty code, or all zeros for an account absent from the state trie) or computable (keccak256 of 0xef0100 followed by the delegate). `expect: \"contract\"` and `expect: \"eip7702\"` without a delegate stay `decision_replay`. (3) erc7710_delegation: the proof covers `disabledDelegations[delegationHash]` and replays the revocation read only. `met` also depends on the principal's EIP-712 signature, the delegate and delegator bindings, the recognized caveat enforcers and a time window evaluated when the request arrived, and the result carries the delegation's hash rather than the delegation, so the condition stays `decision_replay`; a caller that keeps the signed delegation could check more of it. For (1) and (2) the proof is keyed by the wallet (the ERC-20 storage key, or the account's path in the state trie), and a raw-signature /v1/attest record names no wallet for those types (signed_shapes.attest_raw), so `full_replay` also needs the wallet bound in the record: the JWT `sub` with `format: \"jwt\"`, or the signed EVM wallet of a /v1/trust profile. Without it the condition stays `decision_replay`. Condition types that carry no proof stay `decision_replay`."

    governed_action_class: ["read", "write", "transfer", "delegate", "compose"]
    governed_action_notes: "wallet_state is consumed at the access-control boundary of nearly every governed action class. Most commonly used to gate `transfer` (agent commerce, payment) and `delegate` (authority binding), but also appears in `read`-class gating (token-gated content, compliance access) and `compose`-class flows (multi-step agent pipelines that check wallet state between steps)."

# ─────────────────────────────────────────────────
# GAPS AND NOTES
# ─────────────────────────────────────────────────
gaps:

  - area: "Format-aware `wallet_state` routing"
    notes: |
      InsumerAPI routes by wallet format: every family (EVM, Solana, XRPL,
      Bitcoin, Tron, Stellar, Sui) can be the subject of a token_balance
      condition on /v1/attest, while the other condition types are
      chain-scoped as listed under endpoints;
      /v1/trust anchors on the EVM wallet, takes Solana, XRPL, Bitcoin and
      Tron as optional dimensions, and also reads Stellar, Sui, Solana and
      XRPL rows inside its institutional stablecoin and tokenized treasury
      checks; any format can additionally request
      `format: "jwt"` so an evaluated wallet lands in the signed JWT `sub`
      claim, whichever of the seven chain families it belongs to (one
      family per JWT; see signed_shapes.attest_jwt).
      This chain-aware routing is not currently expressible in
      vocabulary.yaml at the signal_types layer. If the vocabulary
      eventually adds a `chain_scope` descriptor, this crosswalk would
      populate it as `multi_chain` with the 37-chain set referenced.

  - area: "`conditionHash` tamper detection"
    notes: |
      /v1/attest signs a SHA-256 hash of each evaluated condition's
      parameters (`conditionHash`) alongside the boolean result. Consumers
      that submitted the conditions can recompute the hash offline from the
      signed `evaluatedCondition` and compare those parameters with what
      they requested. This is a
      tamper-detection primitive that sits under the `replay_class:
      decision_replay` descriptor but has no dedicated canonical term yet.
      Not a request to add one; flagging so the mapping is legible.

