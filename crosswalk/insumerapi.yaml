# crosswalk/insumerapi.yaml
#
# Maps InsumerAPI internal naming, endpoint surface, and signed envelope
# shape to the canonical vocabulary defined in vocabulary.yaml.
#
# InsumerAPI is the foundation layer of the multi-attestation envelope.
# It reads wallet state across 39 chains (the full set for token_balance;
# other condition types are chain-scoped, see endpoints) and issues ECDSA-signed evidence,
# with an additive ML-DSA-65 post-quantum companion, that other
# dimensions compose on top of via the multi-attestation
# envelope documented in MULTI-ATTESTATION-SPEC.md (insumer-examples).
#
# This crosswalk only covers what InsumerAPI itself issues. Orchestration
# across the other dimensions is a consumer-side concern handled by
# SkyeProfile and is out of scope for this file.

system:
  name: InsumerAPI
  home: https://insumermodel.com
  spec: https://github.com/douglasborthwick-crypto/insumer-examples/blob/main/MULTI-ATTESTATION-SPEC.md
  jwks: https://insumermodel.com/.well-known/jwks.json
  jwks_alt: https://api.insumermodel.com/v1/jwks  # same document, different URL
  role: "Foundation layer of the multi-attestation envelope. Reads on-chain wallet state across 39 chains (33 EVM + Solana, XRPL, Bitcoin, Tron, Stellar, Sui) and issues ECDSA-signed evidence with an additive ML-DSA-65 post-quantum companion. Wallet binding varies by endpoint; see signal_types.wallet_state.signed_shapes below."
  license: "Public API, key-gated. Free developer keys at https://insumermodel.com/developers/. Agent self-provisioning via POST /v1/keys/buy (USDC, USDT or BTC on-chain payment, no auth required). /v1/attest, /v1/trust and /v1/trust/batch also accept an `Authorization: Wallet` SIWE envelope from a wallet holding the Insumer Access pass, or x402 pay-per-call in USDC on Base, Polygon, Arbitrum or Solana with no key at all."

license: Apache-2.0
maintainer:
  github: douglasborthwick-crypto
  confirmed_at: "2026-04-10"   # maintainer identity confirmation at PR #1, not a content-review date; see crosswalk_metadata.last_reviewed

# ─────────────────────────────────────────────────
# SIGNAL TYPE MAPPINGS
# How InsumerAPI represents each canonical signal_type from vocabulary.yaml.
# Most entries are `no_mapping` because the foundation layer is scoped to
# wallet_state; the other dimensions are composed on top by independent
# issuers and orchestrated by consumer-side code (SkyeProfile).
# ─────────────────────────────────────────────────
signal_types:

  wallet_state:
    canonical: wallet_state
    match: exact
    notes: |
      InsumerAPI stamps `type: "wallet_state"` directly in the multi-
      attestation envelope. 1:1 mapping, no translation needed. This is
      the foundation-layer signal: balances, NFT holdings, EAS attestations,
      Farcaster IDs, view-call results, ratio rules and agent standing, read
      on-chain and signed with ECDSA P-256 plus an additive ML-DSA-65
      post-quantum companion (since 2026-09-01). Three issuing endpoints
      with different signed payload shapes and different wallet-binding
      semantics: three signed shapes, the raw and JWT forms of /v1/attest
      and the trust profile shared by /v1/trust and /v1/trust/batch; see
      `signed_shapes` below. All three endpoints authenticate with the
      X-API-Key header, or an `Authorization: Wallet` SIWE envelope from a
      wallet that holds the Insumer Access pass, or x402 pay-per-call with
      no key at all. This block was re-verified
      against the live API, openapi.yaml and the JWKS on 2026-09-18.
    issuer_uri: https://api.insumermodel.com
    algorithm: ES256
    kid: insumer-attest-v2   # attestations under v2 API keys (every key created since 2026-06-10). Trust profiles sign under insumer-trust-v2; v1 keys sign both artifact types under insumer-attest-v1; the discount endpoints use insumer-attest-v1 regardless of key version. Full set in `kids`.
    kids:
      insumer-attest-v1: "attestations AND trust profiles issued under v1 API keys (frozen bare-JSON scheme); also every ACP and UCP discount signature, regardless of key version"
      insumer-attest-v2: "attestations issued under v2 API keys (every key created since 2026-06-10): domain-separated canonical preimage"
      insumer-trust-v2: "trust profiles issued under v2 API keys"
      insumer-attest-pq1: "ML-DSA-65 companion on attestations: `pqSig` and `pqKid` on the raw format, `pqJwt` on the JWT format"
      insumer-trust-pq1: "ML-DSA-65 companion on trust profiles"
    jwks_note: "In the attest family the kid says `attest` while the domain tag says `attestation` (insumer-attest-v2 signs under \"insumer.attestation.v2\"); the trust family says `trust` in both. Both spellings are as issued. Five JWKS entries over two keys: the three EC kids share one P-256 key; the two AKP (Algorithm Key Pair, RFC 9964) kids share one ML-DSA-65 key. The v2 and companion kids are bound to artifact type (an attest kid on a trust artifact, or the reverse, fails verification); insumer-attest-v1 predates that split and covers both artifact types under v1 keys."
    default_ttl_seconds: 1800  # attestations and trust profiles both expire 30 minutes after issuance; an attestation whose request contains an erc7710_delegation condition expires after 300 seconds, because revocation is one on-chain call away

    conformance_vectors:
      basis: publicly_verifiable
      ref: "douglasborthwick-crypto/insumer-examples@8a0c38f77278ffa7b5d5d6d87e72685da99fd459"
      source_path: "vectors/"
      tree: "43bca3072b2d95fb08ef7408815ac4b48d90c415"
      discovery_copy: "https://insumermodel.com/.well-known/state-attestation-test-vectors.json"
      discovery_copy_sha256: "f18511a416208fad861e7557e8203ece1376337712b1073e950833d848f774d5"
      verified_at: 2026-09-18
      verifier:
        insumer-verify: "1.8.4"
        "@noble/post-quantum": "0.7.1"
      key_material:
        jwks_snapshot: "vectors/jwks-2026-09-18.json"
        sha256: "506d8ee2b056c65d4267237209b1802e3376bd5e3b08e988158bdacb9fc7a244"
        note: "Twelve of the 23 vectors, 11 to 22, resolve their keys from the live JWKS when they run; the other eleven verify against the key built into insumer-verify and fetch nothing. This snapshot is the key set the published verdicts were produced against, so they stay reproducible across a key rotation. It sits inside the pinned tree above."
      verification: >-
        At the pinned revision the directory holds 23 vectors, 8 envelope fixtures, run.mjs,
        check-well-known.mjs, the package.json and lockfile pinning the verifier versions above,
        and the JWKS snapshot named above. Eleven of the 23 are issuer responses saved exactly as
        the API returned them (01 to 07, 12, 13, 17, 18); the other twelve are derived from those,
        eleven by a deliberate edit to the signed bytes or to the labelling around them and the
        twelfth (16) by presenting vector 01 under different verifier options. Under the pinned
        versions, installed with npm ci from the lockfile, `node run.mjs` reports 23/23 vectors
        matching their stated expectations and `node check-well-known.mjs` reports the discovery
        copy identical to the directory on every signed field. That run is the issuer's own
        reference verifier agreeing with the issuer's stated expectations rather than an
        independent confirmation; the bytes, the options, the expected verdicts and the reasoning
        behind each are published, so a third party can write their own verifier against them and
        contradict any of it. Eleven of the 23 must be refused: 08, 09, 10, 11, 14, 15, 16, 19,
        20, 21 and 23. The predicate is at least one expected false in `checks` outside `expiry`.
        Every vector expects `expiry: false`, because every published vector is past its freshness
        window, so that verdict does not separate them. `attestation.pass` is excluded: 02 and 05
        expect a signed false about the wallet, which is a verdict rather than a verification
        failure. Vector 22 is not among the eleven either; outside `expiry` it carries no expected
        false, and its companion reports unverifiable, which is reported without refusing the
        artifact. Cited as the fresh evidence for the 2026-09-12 re-date of
        signal_types.wallet_state in vocabulary.yaml (issue #164, filed as PR #166).

    endpoints:
      - path: POST /v1/attest
        purpose: "Evaluate 1 to 10 on-chain conditions across nine condition types (token_balance, nft_ownership, eas_attestation, farcaster_id, evm_view_call, ratio_to_amount, ratio_to_supply, erc8004_agent, erc7710_delegation). Returns a signed boolean per condition and overall, never raw balances in standard mode. 1 credit standard, 2 with `proof: \"merkle\"`. Default output is a raw P1363 base64 signature; optional `format: \"jwt\"` returns an ES256 compact JWS with a `pqJwt` sibling."
        chain_coverage: "Counts move as chains are added, so the live figures are openapi.yaml at https://insumermodel.com/openapi.yaml rather than this file. As of 2026-09-18: 39 chains, being 33 EVM plus Solana, XRPL, Bitcoin, Tron, Stellar and Sui. token_balance reaches all 39; nft_ownership the 33 EVM chains plus Solana and XRPL; eas_attestation six EVM chains (Ethereum, Optimism, Base, Arbitrum, Polygon, Avalanche); farcaster_id Optimism; erc8004_agent and erc7710_delegation Base; evm_view_call and the two ratio rules are EVM only. The caller supplies the wallet through the top-level wallet / solanaWallet / xrplWallet / bitcoinWallet / tronWallet / stellarWallet / suiWallet params; conditions carry no wallet field of their own."
      - path: POST /v1/trust
        purpose: "Curated wallet trust fact profile. The EVM anchor is mandatory. Returns per-check booleans by dimension plus a summary; no score, no opinion. A curated check whose chain wallet was not supplied stays in the signed profile with `evaluated: false` and is counted apart from pass and fail. 3 credits standard, 6 with `proof: \"merkle\"`."
        chain_coverage: "A fixed catalogue of named contracts, so it covers fewer chains than /v1/attest and moves only when the catalogue does. As of 2026-09-18: up to 49 checks on 27 chains (21 EVM plus Solana, XRPL, Bitcoin, Tron, Stellar and Sui) in 9 dimensions. The five base dimensions hold 44 checks: stablecoins 26 across the 21 EVM chains, governance 4 (Ethereum, Optimism, Arbitrum), nfts 3 and staking 3 (Ethereum), institutional_stablecoins 8 (Ethereum, Solana, XRPL, Stellar, Sui). Four optional dimensions add 5 checks when the matching wallet param is supplied: solana 1, xrpl 2, bitcoin 1, tron 1. The institutional checks on Solana, XRPL, Stellar and Sui also run only when their wallet param is supplied; otherwise they stay in the profile as evaluated: false rather than dropping out."
      - path: POST /v1/trust/batch
        purpose: "Batch wallet trust profiles, up to 10 wallets per request, block numbers fetched once and shared across wallets. Each wallet gets an independently signed profile. 3 credits per wallet standard, 6 with Merkle."
        chain_coverage: "Same as /v1/trust, per wallet."

    signed_shapes:

      attest_raw:
        endpoint: POST /v1/attest
        format: "Base64-encoded P1363 (r || s, 64 bytes) at data.sig, kid at data.kid. Under insumer-attest-v1 the preimage is the bare JSON.stringify of {id, pass, results, attestedAt} (frozen). Under insumer-attest-v2 it is the domain tag \"insumer.attestation.v2\\n\" followed by recursively key-sorted canonical JSON of {v: 2, id, pass, results, attestedAt}. The companion at data.pqSig, with its kid at data.pqKid, signs \"insumer.attestation.pq1\\n\" plus the same classical preimage the kid selects."
        signed_object:
          - id                # unique attestation identifier (ATST-XXXXXXXXXXXXXXXX)
          - pass              # aggregate boolean result
          - results           # per-condition array
          - attestedAt        # ISO 8601 attestation creation time
          - v                 # literal 2, v2 scheme only
        unsigned_siblings:
          - passCount
          - failCount
          - expiresAt         # returned beside the signed object, outside the preimage; a verifier binds it to the signed attestedAt by the issuance window (30 minutes, or 5 with an erc7710_delegation condition)
        per_condition_fields:
          - condition         # zero-based index
          - label             # caller-supplied label
          - type              # one of the nine condition types
          - chainId           # number for EVM; "solana" | "xrpl" | "bitcoin" | "tron" | "stellar" | "sui" otherwise
          - met               # per-condition boolean
          - evaluatedCondition  # exact condition parameters (object); the key set varies by condition type, and erc8004_agent / erc7710_delegation include the attested wallet
          - conditionHash     # SHA-256 of the canonical evaluatedCondition; tamper detection
          - blockNumber       # hex, per-condition evaluation block (EVM)
          - blockTimestamp    # ISO 8601, per-condition block freshness (EVM)
          - slot              # Solana results carry the slot instead of blockNumber / blockTimestamp
          - ledgerIndex       # XRPL and Stellar results, with ledgerHash when available
          - blockHeight       # Bitcoin and Tron results, together with blockHash
          - checkpointSequence  # Sui results
        wallet_in_signed_bytes: false
        wallet_binding_note: "The raw-sig path of /v1/attest has no top-level wallet field: the signed object is `{id, pass, results, attestedAt}` (plus `v` under v2). For seven of the nine condition types the `evaluatedCondition` carries the condition parameters only (for token_balance: type, chainId, contractAddress, operator, threshold), so neither it nor `conditionHash` binds the wallet. The two agent-standing types, erc8004_agent and erc7710_delegation, do write the attested wallet into `evaluatedCondition`, so for those the wallet is inside `conditionHash` and the signed bytes. For uniform wallet binding across every type use `format: \"jwt\"` (see attest_jwt below)."

      attest_jwt:
        endpoint: POST /v1/attest
        format: "ES256 compact JWS (JWT), requested via `format: \"jwt\"` in the request body; header carries the same kid as the raw form. A sibling `pqJwt` is a compact JWS with alg ML-DSA-65 (RFC 9964), kid insumer-attest-pq1, and the same claims."
        signed_claims:
          - iss               # https://api.insumermodel.com
          - sub               # wallet address: EVM, Solana, XRPL, Bitcoin, Tron, Stellar or Sui
          - jti               # attestation ID
          - iat
          - exp               # +1800 seconds, or +300 when the request contains an erc7710_delegation condition; always equals the attestation's expiresAt
          - pass
          - conditionHash     # array, one hash per condition
          - blockNumber       # the first condition's block; absent when the first condition is on a non-EVM chain
          - blockTimestamp    # likewise
          - results           # per-condition array
        wallet_in_signed_bytes: true
        wallet_binding_note: "The JWT format puts the wallet address into the `sub` claim, inside signature scope. The subject falls through `wallet || solanaWallet || xrplWallet || bitcoinWallet || tronWallet || stellarWallet || suiWallet`, so every chain family InsumerAPI supports lands in `sub` when the caller requests `format: \"jwt\"`."

      trust:
        endpoint: POST /v1/trust  (and /v1/trust/batch per wallet)
        format: "Base64-encoded P1363 signature at data.sig, kid at data.kid (insumer-trust-v2 under v2 keys; insumer-attest-v1 under v1 keys). The v2 preimage is the domain tag \"insumer.trust.v2\\n\" followed by canonical JSON of the whole trust object as returned; unlike attestations, expiresAt is inside the signed object. The companion at data.pqSig, with data.pqKid insumer-trust-pq1, signs \"insumer.trust.pq1\\n\" plus the same preimage."
        signed_object:
          - id                # TRST-XXXXX identifier
          - wallet            # EVM wallet address, in signature scope
          - conditionSetVersion
          - dimensions        # { stablecoins, governance, nfts, staking, institutional_stablecoins, plus solana / xrpl / bitcoin / tron when supplied }; each holds checks[], passCount, failCount, notEvaluatedCount, total
          - summary           # { totalChecks, totalPassed, totalFailed, totalNotEvaluated, dimensionsWithActivity, dimensionsChecked }
          - profiledAt        # ISO 8601
          - expiresAt         # ISO 8601, inside the preimage
        wallet_in_signed_bytes: true
        wallet_binding_note: "/v1/trust signs the EVM wallet directly into the signed object as a top-level field. Results for any other supplied wallet live inside `dimensions`, which is signed with it."

    optional_modes:
      - "proof: \"merkle\" returns an EIP-1186 storage proof anchored to the block header. It covers token_balance and ratio_to_amount conditions on EVM chains, native-balance conditions included, and erc7710_delegation revocation reads against a manager whose storage layout has been verified; on /v1/trust and /v1/trust/batch it does the same for the EVM token checks in the profile. Availability is reported per condition as `proof.available` true or false with a reason (`replay_class: full_replay` when available). Where a chain's RPC does not serve the proof method, the result carries `proof.available: false` with a reason instead, so coverage is probed rather than assumed: as of 2026-09-18, 27 of the 33 EVM chains serve proofs, and ZKsync Era, Sei, Moonriver, Viction, XDC Network and Ronin do not. Never available for nft_ownership, eas_attestation, farcaster_id, evm_view_call, ratio_to_supply and erc8004_agent conditions, nor on Solana, XRPL, Bitcoin, Tron, Stellar or Sui. Doubles the credit cost, refunded to the standard cost whenever no proof was delivered, and reveals the raw on-chain balance to the caller."

  behavioral_trust:
    canonical: behavioral_trust
    match: no_mapping
    notes: "InsumerAPI does not issue behavioral_trust. This dimension composes on top of the foundation layer via independent issuers (RNWY in production as of 2026-04-10 under kid rnwy-trust-v2)."

  wallet_intelligence:
    canonical: wallet_intelligence
    match: no_mapping
    notes: "InsumerAPI does not issue wallet_intelligence. Operator-level wallet classification is produced by RNWY under kid rnwy-wallet-v1 (shipped 2026-04-10)."

  reasoning_integrity:
    canonical: reasoning_integrity
    match: no_mapping
    notes: "Wallet-agnostic by design — not an InsumerAPI concern. ThoughtProof issues this dimension."

  compliance_risk:
    canonical: compliance_risk
    match: no_mapping
    notes: "InsumerAPI does not issue compliance_risk. Revettr produces the scored counterparty exposure signal in the envelope."

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: "APS (gateway.aeoess.com) issues passport_grade; InsumerAPI does not."

  trust_verification:
    canonical: trust_verification
    match: no_mapping
    notes: "AgentID issues trust_verification; InsumerAPI does not."

  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: "AgentGraph issues security_posture (wallet-discoverable content dimension — signed subject is github:owner/repo, wallet is a lookup key). InsumerAPI does not. See flag in the PR description about the issuer attribution in vocabulary.yaml v0.1."

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: "Maiat issues job_performance; InsumerAPI does not. See flag in the PR description about the issuer attribution in vocabulary.yaml v0.1."

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: "SAR (defaultverifier.com) issues settlement_witness. Wallet-bound for new receipts as of kid sar-prod-ed25519-03 (shipped 2026-04-10); wallet-discoverable for legacy kid -02 / -01 receipts. InsumerAPI does not issue this dimension. See flag in the PR description about the issuer attribution in vocabulary.yaml v0.1."

# ─────────────────────────────────────────────────
# DESCRIPTOR DIMENSION MAPPINGS
# How InsumerAPI's wallet_state attestations map onto each descriptor
# dimension. Only wallet_state has descriptors here because it is the
# only signal type InsumerAPI issues.
# ─────────────────────────────────────────────────
descriptor_dimensions:

  wallet_state:
    enforcement_class: advisory
    enforcement_notes: "InsumerAPI produces signed evidence; the consuming agent or policy layer decides whether to permit, deny, or step up. Refusal authority lives with the consumer, not the issuer."

    validity_temporal: at_issuance
    validity_notes: "Each attestation carries block-level freshness context (`blockNumber` + `blockTimestamp` per condition for /v1/attest; `profiledAt` for /v1/trust) and an explicit expiry. Validity is a snapshot at issuance; on-chain state can change after the attestation is minted. Default TTL 30 minutes for cacheability, 5 minutes when the request contains an erc7710_delegation condition."

    refusal_authority: consumer_policy
    refusal_notes: "InsumerAPI never refuses an action; it reports the observed state. Consumer-side composition policy (e.g., SkyeProfile orchestrator or direct integration) decides how to weight the signal."

    invariant_survival: pre_action
    invariant_notes: "Attestations are used before an action (payment, delegation, gated access). Post-action state is the province of settlement_witness (SAR), not wallet_state."

    replay_class: decision_replay
    replay_notes: "Given the signed envelope + JWKS + block number, any verifier can replay the decision offline and confirm `pass` / `met` values matched at that block. Merkle-proof mode (`proof: \"merkle\"`) extends this to `full_replay` for token_balance and ratio_to_amount conditions on the EVM chains whose node serves proofs (27 of 33 as of 2026-09-18) and for verified-layout delegation revocation reads; everything else stays at `decision_replay`."

    governed_action_class: ["read", "write", "transfer", "delegate", "compose"]
    governed_action_notes: "wallet_state is consumed at the access-control boundary of nearly every governed action class. Most commonly used to gate `transfer` (agent commerce, payment) and `delegate` (authority binding), but also appears in `read`-class gating (token-gated content, compliance access) and `compose`-class flows (multi-step agent pipelines that check wallet state between steps)."

# ─────────────────────────────────────────────────
# GAPS AND NOTES
# ─────────────────────────────────────────────────
gaps:

  - area: "Format-aware `wallet_state` routing"
    notes: |
      InsumerAPI routes by wallet format: every family (EVM, Solana, XRPL,
      Bitcoin, Tron, Stellar, Sui) can be the subject of a token_balance
      condition on /v1/attest, while the other condition types are
      chain-scoped as listed under endpoints;
      /v1/trust anchors on the EVM wallet, takes Solana, XRPL, Bitcoin and
      Tron as optional dimensions, and reads Stellar and Sui inside its
      institutional stablecoin checks; any format can additionally request
      `format: "jwt"` so the wallet lands in the signed JWT `sub` claim
      with uniform signature-layer binding across all seven chain families.
      This chain-aware routing is not currently expressible in
      vocabulary.yaml at the signal_types layer. If the vocabulary
      eventually adds a `chain_scope` descriptor, this crosswalk would
      populate it as `multi_chain` with the 39-chain set referenced.

  - area: "`conditionHash` tamper detection"
    notes: |
      /v1/attest signs a SHA-256 hash of each evaluated condition's
      parameters (`conditionHash`) alongside the boolean result. Consumers
      that submitted the conditions can recompute the hash offline and
      confirm the issuer evaluated exactly what was requested. This is a
      tamper-detection primitive that sits under the `replay_class:
      decision_replay` descriptor but has no dedicated canonical term yet.
      Not a request to add one — flagging so the mapping is legible.

