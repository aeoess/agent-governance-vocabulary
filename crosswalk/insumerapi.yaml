    - "Follow-up PR to reconcile `wallet_binding` canonical term (when added) with the A2A#1628 `subject_binding` three-state model (`wallet_bound` / `wallet_acknowledged` / `reference`) — referenced in MULTI-ATTESTATION-SPEC.md §2.5 wallet-binding taxonomy."
