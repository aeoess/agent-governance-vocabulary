# crosswalk/kvrm.yaml
#
# Maps KVRM (kvrm-core + kvrm-ai) decision-routing and tool-call gating
# primitives to the canonical vocabulary defined in vocabulary.yaml v0.2.0.
#
# Primary mapped receipt/gate surface:
#   This crosswalk describes the kvrm-ai DecisionReceipt v0.1 format emitted by
#   gate_to_receipt (kvrm-ai/src/kvrm_ai/gate.py lines 200-262) and
#   build_receipt (kvrm-ai/src/kvrm_ai/receipt.py lines 147-219), matching the
#   committed conformance vectors in
#   kvrm-ai/receipts/{supported,blocked,gate-allowed,gate-blocked}.json
#   (verified against kvrm-ai/tests/fixtures/refund-router). Format and
#   enforcement differences between kvrm-ai and the lower-level engine package
#   kvrm-core are documented inline below.
#
# Pinned upstream commit:
#   https://github.com/robertcprice/KVRM/tree/5765ec5342fbbf9378c18cbb2f00e669afbbe5e6
#
# Primary sources at the pinned commit:
#   - Spec:           docs/specs/DECISION_RECEIPT_SPEC.md (v0.1)
#   - Core types:     kvrm-core/src/kvrm_core/types.py (AuditRecord, RegistrySpec, ActionSpec)
#   - Core context:   kvrm-core/src/kvrm_core/context_schema.py (split_state_features lines 20-33, merge_state_snapshot lines 36-64, evaluate_registry_gate lines 169-189)
#   - Core support:   kvrm-core/src/kvrm_core/support.py (evaluate_support_spec lines 45-49)
#   - Core runtime:   kvrm-core/src/kvrm_core/runtime.py (validate_candidate lines 212-229, runtime_config lines 283-300, decide_and_execute lines 364-497)
#   - Core receipt:   kvrm-core/src/kvrm_core/receipt.py (IN_DIGEST lines 40-50, build_receipt lines 91-154, verify_receipt lines 157-211)
#   - AI receipt:     kvrm-ai/src/kvrm_ai/receipt.py (IN_DIGEST lines 26-36, quantize/canonical_json/hash_json lines 53-72, merge_state lines 75-92, build_gate_trace lines 125-144, build_receipt lines 147-219, verify_receipt lines 242-374)
#   - AI gate:        kvrm-ai/src/kvrm_ai/gate.py (GatedDecision lines 55-76, _runtime_config_of lines 96-101, gate_tool_call lines 104-197, gate_to_receipt lines 200-262)
#   - Emitted vectors: kvrm-ai/receipts/{supported,blocked,gate-allowed,gate-blocked}.json (fixture: kvrm-ai/tests/fixtures/refund-router)
#
# License of this crosswalk file: Apache-2.0

system:
  name: KVRM (Registry-Constrained Decision Architecture & Tool Gate)
  short_name: KVRM
  home: https://github.com/robertcprice/KVRM
  github: https://github.com/robertcprice/KVRM/tree/5765ec5342fbbf9378c18cbb2f00e669afbbe5e6
  spec: https://github.com/robertcprice/KVRM/blob/5765ec5342fbbf9378c18cbb2f00e669afbbe5e6/docs/specs/DECISION_RECEIPT_SPEC.md
  implementation: "Python packages kvrm-ai (kvrm-ai/src/kvrm_ai/, CLI entry point kvrm-ai gate / receipt / verify) and kvrm-core (kvrm-core/src/kvrm_core/)"
  version_tested: "robertcprice/KVRM at commit 5765ec5342fbbf9378c18cbb2f00e669afbbe5e6 (v0.1.0)"
  role: >
    A deterministic, fail-closed action router and pre-execution tool-call gate
    over versioned finite action registries. This crosswalk maps the kvrm-ai
    DecisionReceipt v0.1 and tool-gate surface (kvrm-ai/src/kvrm_ai/receipt.py
    and kvrm-ai/src/kvrm_ai/gate.py, evidenced by the committed vectors in
    kvrm-ai/receipts/). Every action in a RegistrySpec declares a formal
    boolean/numeric support_spec envelope over request features and a reserved
    external world-state snapshot namespace (st_<key> in
    kvrm-ai/src/kvrm_ai/receipt.py lines 75-92; state.<key> in
    kvrm-core/src/kvrm_core/context_schema.py lines 12-64). Before a tool call
    or action executes, KVRM evaluates whether the observed world state and
    request features satisfy the action's support_spec, selector confidence
    threshold, and parameter schema, and emits a content-addressed replay
    receipt (kvrx-<sha256>). KVRM checks whether the observed state admits the
    action; it does not issue agent identities or delegation chains.
  upstream_license: >
    MIT per root LICENSE, kvrm-core/LICENSE, kvrm-ai/LICENSE, kvrm-bench/LICENSE,
    and kvrm-server/LICENSE at commit 5765ec5342fbbf9378c18cbb2f00e669afbbe5e6
    (copyright 2026 Robert Price); specification docs/specs/DECISION_RECEIPT_SPEC.md
    declares MIT (code) and CC-BY-4.0 (specification).

license: Apache-2.0

maintainer:
  mapped_system_maintainer:
    github: robertcprice
    project: robertcprice/KVRM
  crosswalk_contributor:
    github: robertcprice
    author: Robert Price

system_attributes:
  canonicalization_profile: implementation-defined  # Python json.dumps(sort_keys=True, ensure_ascii=True, separators=(",", ":"), allow_nan=False) with q6 fixed-point integer quantization for derived scores (kvrm-ai/src/kvrm_ai/receipt.py lines 53-72)
  hash_family: sha-256                              # receipt_id ("kvrx-" + sha256), registry.digest, runtime_config.config_digest, and execution.output_hash are all SHA-256

# ─────────────────────────────────────────────────
# SIGNAL TYPE MAPPINGS
# One entry per key under vocabulary.yaml signal_types.
# ─────────────────────────────────────────────────
signal_types:

  governance_attestation:
    canonical: governance_attestation
    match: partial
    evidence: emitted
    source_path: "verdict.status"
    internal: "kvrm-ai DecisionReceipt v0.1 (kvrx-<sha256> from gate_to_receipt in kvrm-ai/src/kvrm_ai/gate.py lines 200-262 and build_receipt in kvrm-ai/src/kvrm_ai/receipt.py lines 147-219; lower-level engine variant in kvrm-core/src/kvrm_core/receipt.py lines 91-154)"
    notes: |
      Mapped receipt format (kvrm-ai vs. kvrm-core):
        This row maps the kvrm-ai DecisionReceipt v0.1 format emitted by
        gate_to_receipt (kvrm-ai/src/kvrm_ai/gate.py lines 200-262, committed
        in kvrm-ai/receipts/gate-allowed.json and kvrm-ai/receipts/gate-blocked.json,
        where source_path is verdict.status) and build_receipt
        (kvrm-ai/src/kvrm_ai/receipt.py lines 147-219, committed in
        kvrm-ai/receipts/supported.json and kvrm-ai/receipts/blocked.json, where
        the verdict field is verdict.final_status). The lower-level engine
        module kvrm-core/src/kvrm_core/receipt.py (lines 91-154) emits a distinct
        v0.1 wire variant with four structural differences:
          - State key prefix: kvrm-ai merges state_snapshot.state into flat
            features under st_<key> (merge_state, kvrm-ai/src/kvrm_ai/receipt.py
            lines 75-92), whereas kvrm-core uses state.<key>
            (split_state_features and merge_state_snapshot,
            kvrm-core/src/kvrm_core/context_schema.py lines 20-64).
          - Verdict field name: kvrm-ai gate receipts emit verdict.status
            ("allowed" | "blocked" | "abstained"), whereas kvrm-ai router
            receipts and kvrm-core receipts emit verdict.final_status
            ("executed" | "fallback_executed" | "abstained" |
            "validation_failed" | "fail_closed").
          - Digest formatting and serializer tag: kvrm-ai records bare hex
            SHA-256 strings in registry.digest and runtime_config.config_digest
            with canonical.serializer = "kvrm-ai-receipt-0.1", whereas kvrm-core
            prefixes digests with "sha256:", adds state_snapshot.state_digest,
            and sets canonical.serializer = "kvrm-receipt-0.1".
          - Gate trace keys and registry-only verification: kvrm-ai gate_trace
            records {status, admissible_count, evaluated: [{action_id, passed,
            reason?}]} (build_gate_trace, kvrm-ai/src/kvrm_ai/receipt.py lines
            125-144), whereas kvrm-core records {status, total_actions,
            supported_count, filtered_count, evaluated: [{action_id, supported,
            reason?}]} using evaluate_registry_gate
            (kvrm-core/src/kvrm_core/context_schema.py lines 169-189).
      Overlap: a deterministic, machine-verifiable pre-execution record proving
      that a proposed action (or candidate action set) and an observed world-state
      snapshot were evaluated against a versioned policy/action registry, with
      both the overall verdict and the per-action evaluation trace bound into the
      canonical SHA-256 digest (IN_DIGEST in kvrm-ai/src/kvrm_ai/receipt.py lines
      26-36). Specifically, the digest binds:
        (1) registry: {registry_name, version, digest}, where digest is the
            SHA-256 of the canonical RegistrySpec (every action's support_spec
            boolean/numeric precondition tree, parameters_schema, and
            context_schema; e.g., ded50edb... for
            kvrm-ai/tests/fixtures/refund-router).
        (2) decision and state_snapshot: the proposed action and parameters plus
            the observed external world-state snapshot (merged under the reserved
            st_ prefix by merge_state in kvrm-ai/src/kvrm_ai/receipt.py lines
            75-92; any caller attempt to supply a reserved st_ key in request
            features raises GateError at kvrm-ai/src/kvrm_ai/gate.py lines
            120-122 before evaluation).
        (3) gate_trace.evaluated[]: the boolean pass/fail result for every
            action in the registry plus the exact failing clause path (from
            evaluate_support_spec in kvrm-core/src/kvrm_core/support.py lines
            45-49; for example,
            unsupported_features:support_spec.all[0]:st_refundable:eq in
            kvrm-ai/receipts/gate-blocked.json).
        (4) verdict: status ("allowed", "blocked", or "abstained" in gate mode;
            final_status in router mode), support_passed, confidence_met, and
            validation_reason.
      Where it diverges from canonical governance_attestation (why partial):
        (1) Content-addressed replay vs. cryptographic issuer signature in v0.1:
            Nothing in a v0.1 receipt is cryptographically signed
            (signed_payload_fields is intentionally omitted). In
            DECISION_RECEIPT_SPEC.md v0.1 (section 3 and section 9),
            receipt_id = "kvrx-" + sha256(canonical_json(IN_DIGEST)), while
            produced_by is an unsigned informational field excluded from
            IN_DIGEST (EXCLUDED_FROM_DIGEST at kvrm-ai/src/kvrm_ai/receipt.py
            line 38) and signatures: [] / anchors: [] are reserved empty arrays.
            A v0.1 receipt proves internal consistency and deterministic replay
            when verified against the domain runtime (kvrm-ai verify <receipt>
            --domain <dir>), not third-party cryptographic key authenticity.
        (2) World-state admissibility vs. delegated principal authority:
            KVRM evaluates whether the observed world state and input features
            admit the action under registry.digest; it does not record who
            delegated authority to the agent or verify a principal delegation
            chain.

  behavioral_trust:
    canonical: behavioral_trust
    match: false_analog
    evidence: emitted
    source_path: "candidates[].effective_confidence_q6"
    internal: "DecisionCandidate quantized selector scores (confidence_q6, effective_confidence_q6, agreement_q6, margin_q6 in kvrm-ai/src/kvrm_ai/receipt.py lines 95-122 and kvrm-ai/src/kvrm_ai/gate.py lines 79-93)"
    notes: |
      Recorded as false_analog to prevent a concrete substitution hazard. Every
      KVRM receipt emits per-candidate fixed-point scores in [0, 1000000]
      (confidence_q6 and effective_confidence_q6, quantized via round(score * 10^6)
      after EvidenceFusionCalibrator fuses rule, retrieval, prototype, semantic,
      and learned selector scores with agreement/margin bonuses). Despite the
      field name "confidence" and the normalized [0, 1] scale, this number
      measures single-invocation feature-to-action routing fit for the current
      request, not a longitudinal behavioral trust or reputation score over an
      agent's historical conduct. Wiring candidates[].effective_confidence_q6 or
      verdict.confidence_q6 into a consumer expecting behavioral_trust would
      conflate per-call input classification margin with agent trustworthiness.

  peer_review:
    canonical: peer_review
    match: no_mapping
    notes: |
      KVRM does not emit post-task peer or delegator evaluations. Searched
      kvrm-core/src/kvrm_core/ and kvrm-ai/src/kvrm_ai/ at commit
      5765ec5342fbbf9378c18cbb2f00e669afbbe5e6; all emitted records are
      per-decision gate/routing artifacts.

  completion_ratio:
    canonical: completion_ratio
    match: no_mapping
    notes: |
      KVRM does not track longitudinal task completion ratios across delegated
      work. Benchmark evaluation reports in kvrm-bench/ compute aggregate
      semantic_correctness and unsupported_rejection rates over static test
      suites, not per-agent runtime completion ratios.

  entity_continuity:
    canonical: entity_continuity
    match: no_mapping
    notes: |
      KVRM receipts do not track agent identity persistence, key rotation, or
      execution-environment migration.

  bilateral_receipt:
    canonical: bilateral_receipt
    match: no_mapping
    notes: |
      A KVRM DecisionReceipt (kvrx-<sha256>) is a single-verifier pre-execution
      gate artifact with signatures: [] reserved empty in v0.1, not a co-signed
      two-party delegator/delegatee acknowledgment.

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: |
      KVRM does not witness payment settlement or financial value transfer. When
      an action executes after passing the gate, execution.output_hash records
      the SHA-256 of the local executor return payload (DECISION_RECEIPT_SPEC.md
      section 4), not a payment rail settlement attestation.

  trust_verification:
    canonical: trust_verification
    match: no_mapping
    notes: |
      KVRM does not verify agent or principal identity, KYC status, or entity
      registration. Searched docs/specs/DECISION_RECEIPT_SPEC.md,
      kvrm-core/src/kvrm_core/, and kvrm-ai/src/kvrm_ai/ at commit
      5765ec5342fbbf9378c18cbb2f00e669afbbe5e6; caller identity attributes only
      appear if a domain author declares them as ordinary domain features in
      context_schema, with no cryptographic identity verification by KVRM.

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: |
      KVRM has no agent passport primitive and emits no assurance or verification
      grade.

  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: |
      KVRM does not assess or score the security posture of an agent, endpoint,
      or wallet.

  wallet_state:
    canonical: wallet_state
    match: no_mapping
    notes: |
      No wallet, balance, or on-chain holding primitive exists in kvrm-core or
      kvrm-ai at commit 5765ec5342fbbf9378c18cbb2f00e669afbbe5e6.

  wallet_intelligence:
    canonical: wallet_intelligence
    match: no_mapping
    notes: "Status note: reserved in vocabulary.yaml. KVRM has no wallet primitive or wallet-activity classifier."

  reasoning_integrity:
    canonical: reasoning_integrity
    match: no_mapping
    notes: |
      Status note: reserved in vocabulary.yaml. KVRM evaluates the structured
      tool-call proposal (decision.input_features, proposed_action,
      proposed_parameters) and external state_snapshot against support_spec; it
      does not inspect or attest to the LLM's internal chain-of-thought or
      deliberation trace.

  cognitive_attestation:
    canonical: cognitive_attestation
    match: no_mapping
    notes: "Status note: reserved in vocabulary.yaml. KVRM makes no claim about model weights, cognitive state, or internal reasoning."

  compliance_risk:
    canonical: compliance_risk
    match: no_mapping
    notes: "Status note: reserved in vocabulary.yaml. KVRM enforces binary/enumerated support envelopes per action rather than emitting an entity-level compliance risk score."

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: "Status note: reserved in vocabulary.yaml. KVRM evaluates single decisions pre-execution and does not score cumulative job performance."

# ─────────────────────────────────────────────────
# DECISION TRAJECTORY
# ─────────────────────────────────────────────────
decision_trajectory:

  decision_lineage:
    canonical: decision_lineage
    match: no_mapping
    notes: |
      Each KVRM DecisionReceipt v0.1 is a self-contained single-decision
      artifact keyed by receipt_id ("kvrx-" + sha256) and decision.case_id.
      Searched docs/specs/DECISION_RECEIPT_SPEC.md, kvrm-core/src/kvrm_core/receipt.py,
      and kvrm-ai/src/kvrm_ai/receipt.py at commit
      5765ec5342fbbf9378c18cbb2f00e669afbbe5e6: receipts do not carry a
      prev_receipt_hash pointer chaining sequential decisions across an agent's
      lifecycle.

  baseline_revision:
    canonical: baseline_revision
    match: structural
    evidence: emitted
    source_path: "registry.digest"
    internal: "registry.{registry_name, version, digest} and runtime_config.config_digest in DecisionReceipt (kvrm-ai/src/kvrm_ai/receipt.py lines 166-184 and kvrm-ai/src/kvrm_ai/gate.py lines 96-101, 207-230)"
    notes: |
      Every KVRM AuditRecord and DecisionReceipt embeds registry.digest — the
      canonical SHA-256 over the active RegistrySpec (all action definitions,
      support_spec precondition trees, parameters_schema, and context_schema,
      computed by compute_registry_digest in kvrm-core/src/kvrm_core/registry.py)
      — alongside runtime_config.config_digest. Both digests sit inside
      IN_DIGEST. During verification (verify_receipt in
      kvrm-ai/src/kvrm_ai/receipt.py lines 242-374), any mismatch between the
      receipt's registry.digest and the supplied registry immediately returns
      FAIL_INTEGRITY ("registry digest mismatch").
      Scope of runtime_config.config_digest:
        In kvrm-ai (_runtime_config_of in kvrm-ai/src/kvrm_ai/gate.py lines
        96-101 and kvrm-ai/src/kvrm_ai/cli.py lines 42-48), config_digest hashes
        only {threshold, fallback_action_id, calibrator: {name}}. It does NOT
        cover the internal EvidenceFusionCalibrator weight parameters
        (agreement_bonus_weight, margin_bonus_weight,
        contradiction_penalty_weight, min_effective_confidence), nor the
        extended runtime flags serialized by KVRMRuntime.runtime_config() in
        kvrm-core/src/kvrm_core/runtime.py (lines 283-300: threshold_q6,
        enforce_registry_contract, validator_is_stock, validator_call_mode,
        state_provider_configured, post_hoc_scaler).
      Divergence from canonical baseline_revision: canonical baseline_revision
      tracks deliberate updates to an agent's behavioral baseline so legitimate
      policy changes are not misclassified as behavioral drift; KVRM's
      registry.digest and config_digest pin the declarative action-space and
      threshold revision so decisions evaluated under different registry
      versions are cryptographically distinguished and replayed against the
      policy version that governed them.

  divergence_signal:
    canonical: divergence_signal
    match: no_mapping
    notes: |
      KVRM does not compute a continuous statistical drift metric over longitudinal
      agent behavior. Out-of-envelope inputs fail evaluate_support_spec on the
      individual call (recorded in gate_trace.evaluated[] and verdict.status =
      "blocked" or verdict.final_status = "fail_closed").

  trust_velocity:
    canonical: trust_velocity
    match: no_mapping
    notes: KVRM emits no longitudinal trust score, so no rate-of-change derivative exists.

# ─────────────────────────────────────────────────
# DESCRIPTOR DIMENSIONS
# Top-level values are scoped to the mapped kvrm-ai gate/receipt surface
# (gate_tool_call and gate_mcp_call); surface differences vs.
# KVRMRuntime.decide_and_execute are documented in the notes below.
# ─────────────────────────────────────────────────
descriptor_dimensions:
  enforcement_class: refusal_authority
  enforcement_notes: |
    Scoped by execution surface:
      - kvrm-ai gate_tool_call (kvrm-ai/src/kvrm_ai/gate.py lines 104-197),
        gate_mcp_call (kvrm-ai/src/kvrm_ai/mcp_gateway/gateway.py
        lines 70-131), and KVRMRuntime.validate_candidate
        (kvrm-core/src/kvrm_core/runtime.py lines 212-229):
        enforcement_class is refusal_authority (as in crosswalk/quesen.yaml).
        These surfaces evaluate the proposed call and return a structured
        allow/block/abstain decision (GatedDecision with allowed: false /
        status: "blocked" | "abstained"), while the caller or MCP host is
        responsible for not running the tool.
      - KVRMRuntime.decide_and_execute (kvrm-core/src/kvrm_core/runtime.py lines
        364-497): enforcement_class is binding. Here the runtime wraps the
        ActionExecutor directly and invokes _execute_candidate only when
        support_spec, confidence calibration, and DeterministicValidator.validate
        all succeed (or routes to a validated safe fallback).
  validity_temporal: at_processing
  refusal_authority: consumer_policy
  refusal_notes: |
    Scoped by execution surface:
      - kvrm-ai gate_tool_call, gate_mcp_call
        (kvrm-ai/src/kvrm_ai/mcp_gateway/gateway.py lines 70-131), and
        KVRMRuntime.validate_candidate: refusal_authority is consumer_policy
        (as in crosswalk/quesen.yaml). The gate emits the verdict and machine
        reason code; actual refusal at the tool-execution call site lives with
        the calling consumer.
      - KVRMRuntime.decide_and_execute (kvrm-core/src/kvrm_core/runtime.py lines
        364-497): refusal_authority is verifier, because the runtime itself
        sits in the execution path and withholds the executor call on any gate
        or validator failure.
  invariant_survival: pre_action
  replay_class: full_replay
  replay_notes: |
    Condition for full_replay vs. registry-only verification:
      - With --domain (verify_receipt(..., registry=registry, runtime=runtime)
        in kvrm-ai/src/kvrm_ai/receipt.py lines 293-362, invoked via
        `kvrm-ai verify <receipt> --domain <dir>`): full_replay holds. The
        verifier recomputes receipt_id over IN_DIGEST, verifies registry.digest,
        re-evaluates gate_trace.evaluated[], re-runs the full runtime pipeline
        (gate_tool_call or runtime.decide_and_execute), checks candidate_scores
        within 1 unit of q6 tolerance, and rejects any tampered verdict with
        FAIL_REPLAY.
      - With --registry alone (verify_receipt(..., registry=registry,
        runtime=None) in kvrm-ai/src/kvrm_ai/receipt.py lines 279-291): only
        receipt_id, registry.digest, and gate_trace.evaluated[] are checked.
        Because the runtime pipeline is not re-executed when runtime is None, a
        blocked receipt whose verdict.status is edited to "allowed" (with its
        receipt_id recomputed) still returns PASS under --registry alone. By
        contrast, kvrm-core's verify_receipt (kvrm-core/src/kvrm_core/receipt.py
        lines 157-211) takes only (receipt, registry) and deliberately returns
        VERIFY_PARTIAL because selector scores and final verdict are not
        re-derived without a runtime.
      - Additionally, runtime_config.config_digest in kvrm-ai hashes
        {threshold, fallback_action_id, calibrator: {name}} (gate.py lines
        96-101) and does not cover internal EvidenceFusionCalibrator weight
        parameters, so full_replay relies on the domain module supplying the
        matching calibrator instance.
  governed_action_class:
    - write
    - read
  measurement_point: mutation_boundary
  notes: |
    enforcement_class (refusal_authority on kvrm-ai gate / MCP gateway; binding
    on KVRMRuntime.decide_and_execute) and refusal_authority (consumer_policy on
    kvrm-ai gate / MCP gateway; verifier on KVRMRuntime.decide_and_execute) are
    scoped by surface in enforcement_notes and refusal_notes above.
    validity_temporal: at_processing. The support gate evaluates
    decision.input_features merged with state_snapshot.state (fetched_at) at the
    moment the tool call is processed.
    invariant_survival: pre_action. Support envelopes and parameter schemas are
    checked before the tool call is executed; on the gate surface the caller
    remains free to proceed after receiving the verdict, and on
    decide_and_execute a blocked call never invokes the executor
    (execution.status is "not_executed" or "blocked").
    replay_class: full_replay when verified with the domain runtime (`kvrm-ai
    verify <receipt> --domain <dir>`, receipt.py lines 293-362); with
    `--registry` alone (runtime=None, receipt.py lines 279-291), only
    receipt_id, registry.digest, and gate_trace.evaluated[] are re-evaluated
    (see replay_notes above).
    governed_action_class: write and read. Designed primarily for state-mutating
    tool calls (write) in MCP gateways and operational routers, while also
    applicable to gated retrieval/inspection actions (read) declared in a
    domain registry.
    measurement_point: mutation_boundary. The gate evaluates each proposed tool
    call immediately before side-effect execution.

summary: |
  KVRM (kvrm-core and kvrm-ai) is a deterministic, fail-closed action router and
  pre-execution tool-call gate over versioned finite action registries. This
  crosswalk maps the kvrm-ai DecisionReceipt v0.1 and tool-gate surface
  (kvrm-ai/src/kvrm_ai/receipt.py and kvrm-ai/src/kvrm_ai/gate.py, evidenced by
  kvrm-ai/receipts/{supported,blocked,gate-allowed,gate-blocked}.json against
  kvrm-ai/tests/fixtures/refund-router) and documents where the lower-level
  kvrm-core receipt and runtime surfaces differ. KVRM answers a single
  governance question at the tool-execution boundary: given the proposed action,
  request features, and a recorded external world-state snapshot (st_* in
  kvrm-ai; state.* in kvrm-core), does the observed state satisfy the action's
  declared support_spec envelope, calibrated confidence threshold, and parameter
  schema?
  One signal_types row is partial (governance_attestation: emitted kvrx-<sha256>
  DecisionReceipt binding decision, state_snapshot, registry.digest,
  runtime_config.config_digest, quantized candidates[], gate_trace.evaluated[],
  and verdict, but content-addressed with signatures: [] reserved empty in v0.1
  and scoped to world-state admissibility rather than principal delegation).
  One decision_trajectory row is structural (baseline_revision: emitted
  registry.digest and runtime_config.config_digest inside IN_DIGEST, where
  kvrm-ai's config_digest covers threshold, fallback_action_id, and calibrator
  class name).
  One signal_types row is false_analog (behavioral_trust: per-call selector
  confidence_q6 / effective_confidence_q6 measures feature-routing fit, not
  longitudinal agent trustworthiness).
  All identity, delegation-chain, wallet, and post-action settlement terms are
  no_mapping.
