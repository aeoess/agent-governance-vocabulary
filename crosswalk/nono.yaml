system:
  name: nono
  short_name: nono
  home: https://nono.sh
  spec: https://github.com/nolabs-ai/nono/blob/540850e3ca2cfd9ac09282b56ae21105a5eb3fcd/docs/cli/features/audit.mdx
  spec_version: "nono v0.82.0 line, audit Merkle scheme alpha, attestation predicate https://nono.sh/attestation/audit-session/alpha (version 1), approval webhook protocol v1"
  repo: https://github.com/nolabs-ai/nono
  implementation: "Rust, crates/nono (audit, trust, supervisor types) and crates/nono-cli (audit commands, approval runtime, platform policy), binary nono"
  role: >
    "a capability-based process level sandboxing system for running
    untrusted AI agents" (CONTRIBUTING.md). "Every `nono run` session is
    recorded by default" and "the trusted supervisor records the session,
    the event log is committed with a Merkleized integrity structure, and
    optional signing lets a key holder attest to the completed session"
    (docs/cli/features/audit.mdx).
  identity_layer: >
    Keys. --audit-sign-key signs with a keyed ECDSA P-256 key, and the
    attestation names key_id. "Supplying `expected_public_key` is what gives
    the result an external trust anchor; without it, verification proves
    only that the bundle, metadata summary, and embedded public key are
    internally self-consistent" (audit.rs). Approval reviewer identity is
    whatever the approval backend returns. Control plane enrollment binds a
    subject_id to a tenant (audit-delivery-v1.md).
  upstream_license: "Apache-2.0 (LICENSE)."

license: Apache-2.0

maintainer:
  mapped_system_maintainer:
    github: lukehinds
    project: nolabs-ai/nono (Maintainer Council per MAINTAINERS.md, with SequeI, panga and kipz)
    confirmed_at: null
  crosswalk_contributor:
