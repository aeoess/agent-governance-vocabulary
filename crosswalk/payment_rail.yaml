# crosswalk/payment_rail.yaml
#
# Settlement-layer verb mapping across five agent payment protocols selected by the contributor: x402, AP2, ACP, MPP, and UCP. Inclusion does not indicate adoption, significance, completeness, or endorsement.
#
# Purpose: provide a single lookup table for implementers building
# multi-rail agent payment infrastructure. Each protocol uses different
# names for overlapping operations; this file maps them to a shared
# settlement vocabulary and records where protocols diverge structurally.
#
# Scope: this crosswalk maps SETTLEMENT-LAYER operations (money
# movement). It does NOT map authorization-layer operations (mandate
# creation, delegation, budget reservation). Those belong in
# crosswalk/budget_reservation.yaml and the passport layer respectively.
#
# Not all listed protocols are settlement protocols. AP2 self-describes
# as an authorization/mandate layer; ACP and UCP are checkout
# orchestration layers that delegate settlement to merchant PSPs. The
# crosswalk records this as it is: not_found and delegated cells are
# findings about a protocol boundary, not gaps to fill.
#
# Classification model: vocabulary-settlement.yaml
# (settlement-v1-incubating, experimental). Cells that carry a judgment
# split observed protocol behavior from the contributor's
# interpretation (see basis blocks). Every third-party cell carries an
# open disputes list so a protocol maintainer can contest a cell.
#
# Author:  @Ectsang (goodmeta)
#
# License: Apache-2.0
#
# ----------------------------------------------------------------------
# dispute entry shape:
# - raised_by: <GitHub identity>
#   affiliation: <protocol/project>
#   issue: <URL>
#   scope: <status|basis|protocol_boundary|other>
#   state: open
# A rendered cell shows `contested` next to its status while any dispute is open.
# ----------------------------------------------------------------------

crosswalk_type: domain_incubation
status: INCUBATING

non_endorsement: >-
  The listed protocols have not reviewed or endorsed this crosswalk.
  Protocol selection and cell classifications were proposed by the
  contributor and are hosted for incubation and review. Repository
  inclusion does not establish a registry-maintainer position on
  protocol capability, quality, significance, or completeness.

classification_model:
  source: vocabulary-settlement.yaml
  status: experimental
  model_id: settlement-v1-incubating

# Per-protocol re-verification date. The domain_incubation sunset is
# measured from the stalest date, so this file is only as fresh as its
# oldest column. Second re-verification pass 2026-10-15 under
# CONTRIBUTING Gate 3 (every system re-pinned, every cell re-read at the
# new pin, per-cell results recorded in the re-verification PR). Earlier
# dates (2026-07-13) and classifications stay in git history. Stalest
# date 2026-10-15, 90-day sunset 2027-01-13.
verified_at:
  x402: 2026-10-15    # v2 spec + exact/auth-capture schemes (auth-capture v1.1 paymentFlow); facilitator API
  ap2:  2026-10-15    # v0.2.0 specification.md + flows.md + payment_mandate.md (no newer release)
  acp:  2026-10-15    # 2026-04-17 OpenAPI + OpenRPC + delegate_payment RFC (main moved only in spec/unreleased)
  mpp:  2026-10-15    # draft-httpauth-payment-01 + charge and subscription intents (main), PR #226 closed unmerged
  ucp:  2026-10-15    # v2026-08-25 checkout + order specs (REST + MCP), payment extensions

# Pinned upstream references. Each protocol is pinned to an immutable
# ref (release tag with commit, or commit SHA); MPP is pinned by commit
# SHA, never a rolling tag, because it is draft. upstream_stability
# records how settled each ref is. The commit is the authority: UCP
# release tags are re-cut for backports (v2026-04-08 now resolves to
# a25a4a24, not the a2d8bf0b this file pinned on 2026-07-13).
upstream_references:
  ap2:
    ref: "google-agentic-commerce/AP2@v0.2.0"
    commit: b4587ac1
    released: 2026-04-28
    upstream_stability: merged_release
    note: v0.2.0 is still the latest release, and main after it changes no docs/ap2 file.
  ucp:
    ref: "Universal-Commerce-Protocol/ucp@v2026-08-25"
    commit: cd78fb38
    upstream_stability: merged_release
  x402:
    ref: "x402-foundation/x402@faa1c694"
    branch: main
    upstream_stability: merged_commit
  acp:
    ref: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df"
    branch: main
    upstream_stability: merged_commit
  mpp_charge:
    ref: "tempoxyz/mpp-specs@782abaeb"
    branch: main
    locator: draft-httpauth-payment-01
    upstream_stability: draft
    reverify_by: 2027-01-13
    reverified_at: 2026-10-15
  mpp_authorize:
    ref: "tempoxyz/mpp-specs#226@4b8536cd"
    state: closed_unmerged
    upstream_stability: closed_unmerged
    reverified_at: 2026-10-15
    note: >
      PR #226 was closed without merging ("closing this out as it is
      stale"). No authorize intent exists on main at 782abaeb. Kept as a
      historical record only, not as a live proposal.

# ----------------------------------------------------------------------
# Protocol classification
# ----------------------------------------------------------------------
#
# Not every protocol belongs on every row. Forcing 1:1 equivalence
# where it does not exist is more harmful than recording the boundary.

protocol_layers:
  x402:
    layer: settlement
    schemes: [exact, upto, auth-capture, batch-settlement]
    settlement_actor: facilitator
    note: >
      In the facilitator-submitted family the client signs a payment
      (EIP-3009 transferWithAuthorization or Permit2 on EVM) and the
      facilitator submits it at /settle. Since this pin the exact scheme
      also defines a client-submitted (payment proof) family, where the
      client submits the payment and /settle validates the proof. Cells
      below describe the facilitator-submitted family. The
      client-submitted family is not separately classified.

  ap2:
    layer: authorization
    settlement_actor: none
    note: >
      AP2 self-describes (v0.2.0 specification.md) as an
      authorization/mandate layer. It creates cryptographic mandates
      (SD-JWT VCs) proving principal authorization and does not perform
      settlement; settlement is delegated to the merchant's existing
      payment processor. Its verbs are mandate verbs (sign, bind,
      constrain), not settlement verbs, so most settlement rows show
      not_found. AP2 appears at the authorize row because its mandates
      serve as authorization evidence consumed by settlement-layer
      protocols.

  acp:
    layer: checkout_orchestration
    settlement_actor: merchant_psp
    note: >
      ACP orchestrates the checkout flow (cart, complete, order).
      completeCheckoutSession triggers payment on the merchant's own
      PSP (Stripe, Adyen, and similar). ACP does not define what happens
      after the PSP processes the charge.

  mpp:
    layer: settlement
    schemes: [charge]
    draft_intents: [subscription]
    settlement_actor: server
    note: >
      HTTP-native 402 challenge/credential/receipt. Each charge exchange
      is stateless. The charge intent bundles authorize and settle into
      one round-trip. Main carries the charge and subscription intents,
      and session exists only as method-level drafts. The authorize intent
      proposed in PR #226 was closed unmerged, and main has no
      authorize intent.

  ucp:
    layer: checkout_orchestration
    settlement_actor: merchant_psp
    note: >
      Structurally similar to ACP. complete_checkout triggers payment
      via the merchant's payment handler (Google Pay, Shop Pay, cards).
      Supports AP2 mandates as an extension
      (dev.ucp.common.payment.ap2_mandate, formerly
      dev.ucp.shopping.ap2_mandate) and split payments across multiple
      instruments (dev.ucp.common.payment.split_payments, in the
      v2026-08-25 release). Split payments do not change the settlement
      verb surface; complete_checkout remains the charge operation
      regardless of instrument count.

# ----------------------------------------------------------------------
# Settlement verb mapping
# ----------------------------------------------------------------------
#
# Canonical verbs are governed in vocabulary-settlement.yaml
# (settlement-v1-incubating). Mapping status (per-protocol, per-verb)
# describes how each protocol relates to a canonical settlement verb.
#
#   mapped     = verb exists in the protocol under a different name
#   bundled    = verb exists but is combined with another operation
#   delegated  = operation exists but is handled outside protocol scope
#   not_found  = no equivalent found within the searched scope; a
#                bounded negative, not a claim about the whole protocol
#
# Judgment-bearing cells (bundled, delegated) split observed behavior
# from interpretation under a basis block and carry classification_by.
# not_found cells carry the searched scope that bounds the negative.
# Every third-party cell carries disputes: [].

verbs:

  normative_force: descriptive_only_pending_convergence
  # Content is descriptive until each protocol's verb mapping gains a
  # second independent implementer; tracks content force, not the
  # section's promotion lifecycle (see top-level `status`).

  charge:
    canonical_meaning: >
      Initiate a payment: the operation that starts money moving from
      payer to payee.
    mappings:
      x402_exact:
        verb: settle
        endpoint: "POST /settle"
        status: mapped
        sync: true_initiates_async
        source: "x402-foundation/x402@faa1c694 specs/schemes/exact/scheme_exact.md, x402-specification-v2.md 7.2 POST /settle"
        note: >
          Facilitator-submitted family: the client signs the payment and
          the facilitator's /settle submits it. Settle in x402 exact is
          the charge; there is no separate initiation step.
        disputes: []
      x402_auth_capture:
        verb: charge
        params: "extra.paymentFlow: authorization"
        status: mapped
        source: "x402-foundation/x402@faa1c694 specs/schemes/auth-capture/scheme_auth_capture.md, Lifecycle operations"
        note: >
          Reclassified 2026-10-15 from bundled. Scheme v1.1 removed
          extra.autoCapture and names charge as its own lifecycle
          operation ("Collects and distributes the funds in one step,
          with no hold"), selected by paymentFlow authorization. This is
          the same one-step shape as x402_exact settle, which is mapped.
        disputes: []
      ap2:
        status: not_found
        source: "google-agentic-commerce/AP2@v0.2.0 (b4587ac1)"
        searched:
          - "specification.md, flows.md, mandate types @ v0.2.0 (b4587ac1): no charge operation"
        note: >
          AP2 self-describes as an authorization/mandate layer and does
          not charge. The merchant initiates payment on its own rail
          using the mandate as authorization evidence.
        disputes: []
      acp:
        verb: completeCheckoutSession
        endpoint: "POST /checkout_sessions/{id}/complete"
        mcp_tool: complete_checkout_session
        status: mapped
        sync: true
        source: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df 2026-04-17 OpenAPI, POST /checkout_sessions/{id}/complete"
        note: >
          Triggers payment on the merchant's PSP. Bundles authorize and
          capture from the protocol's perspective (no separate pre-auth
          flow).
        disputes: []
      mpp:
        status: bundled
        classification_by: contributor
        upstream_stability: draft
        reverify_by: 2027-01-13
        reverified_at: 2026-10-15
        basis:
          source: "tempoxyz/mpp-specs@782abaeb draft-httpauth-payment-01, charge intent (Payment credential in Authorization or Payment-Authorization)"
          observed: >
            The client sends a fulfilled payment credential in the
            Authorization header (or Payment-Authorization when the
            challenge selects it). The server verifies and settles it
            within a single HTTP exchange (charge intent).
          interpretation: >
            Classified bundled because charge and settle occur in one
            round-trip with no separable charge step.
        disputes: []
      ucp:
        verb: complete_checkout
        endpoint: "POST /checkout-sessions/{id}/complete"
        mcp_tool: complete_checkout
        status: mapped
        sync: true_or_accepted_async
        source: "Universal-Commerce-Protocol/ucp@v2026-08-25 (cd78fb38) docs/specification/shopping/checkout/rest.md + index.md Complete Checkout, POST /checkout-sessions/{id}/complete"
        note: >
          Same pattern as ACP. Triggers payment on the merchant's
          payment handler. Completion may finish synchronously (status
          completed with order) or be accepted for asynchronous
          processing (status complete_in_progress, no order). The sync
          field was recorded as true before 2026-10-15.
        disputes: []

  authorize:
    canonical_meaning: >
      Pre-approve a payment without moving money. Reserves funds or
      creates a binding commitment that a future charge will succeed.
    mappings:
      x402_exact:
        status: bundled
        classification_by: contributor
        basis:
          source: "x402-foundation/x402@faa1c694 specs/schemes/exact/scheme_exact.md Payment Flow, client signature consumed at /settle"
          observed: >
            The exact scheme has no separate authorize step; the client's
            signed payment (EIP-3009 or Permit2 on EVM) carries
            authorization and the facilitator consumes it at /settle,
            after /verify in the default authorization flow.
          interpretation: >
            Classified bundled because authorization is not a separable
            step; the signature is consumed at settle time.
        disputes: []
      x402_auth_capture:
        verb: authorize
        params: "extra.paymentFlow: escrow (scheme default)"
        status: mapped
        source: "x402-foundation/x402@faa1c694 specs/schemes/auth-capture/scheme_auth_capture.md, Lifecycle operations (authorize)"
        note: >
          On-chain escrow lock ("Reserves the client's funds, where they
          are held"). Funds move to the AuthCaptureEscrow contract, not
          to the payee. Requires a separate capture to finalize. Selected
          by paymentFlow escrow since scheme v1.1 removed autoCapture.
        disputes: []
      ap2:
        verb: "Sign Mandate (Payment Mandate)"
        status: mapped
        source: "google-agentic-commerce/AP2@v0.2.0 (b4587ac1) specification.md, Payment Mandate (SD-JWT VC)"
        note: >
          Cryptographic credential (SD-JWT VC) proving the principal
          authorized this spend. Does not reserve funds; the mandate is
          evidence, not a hold. Structurally different from card-rail
          pre-auth.
        disputes: []
      acp:
        verb: delegatePayment
        endpoint: "POST /agentic_commerce/delegate_payment"
        status: mapped
        source: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df rfcs/rfc.delegate_payment.md, POST /agentic_commerce/delegate_payment"
        note: >
          Creates a scoped payment token with Allowance constraints
          (max_amount, merchant_id, expires_at). Constrains a card
          token; does not reserve funds on the rail.
        disputes: []
      mpp:
        status: not_found
        upstream_stability: draft
        reverify_by: 2027-01-13
        reverified_at: 2026-10-15
        source: "tempoxyz/mpp-specs@782abaeb draft-httpauth-payment-01, specs/intents (main)"
        searched:
          - "tempoxyz/mpp-specs@782abaeb: draft-httpauth-payment-01, specs/intents holds charge-00 and subscription-00 only, no authorize intent on main"
        proposed_in:
          ref: "tempoxyz/mpp-specs#226@4b8536cd"
          state: closed_unmerged
          upstream_stability: closed_unmerged
          reverified_at: 2026-10-15
          note: >
            PR #226 proposed an authorize intent separating pre-auth from
            capture. It was closed without merging as stale. It is kept as
            a historical record and no longer supports any statement
            about MPP authorize semantics.
        note: >
          On main the charge intent bundles authorize and settle. The
          subscription intent on main creates a recurring authorization
          whose activation collects the first period's charge. It is not
          classified here as a single-payment authorize. That boundary is
          open for the contributor or an MPP maintainer to contest.
        disputes: []
      ucp:
        status: delegated
        classification_by: contributor
        basis:
          source: "Universal-Commerce-Protocol/ucp@v2026-08-25 (cd78fb38) docs/specification/payment/extensions/ap2-mandates.md, dev.ucp.common.payment.ap2_mandate"
          observed: >
            UCP consumes AP2 mandates through the
            dev.ucp.common.payment.ap2_mandate extension (named
            dev.ucp.shopping.ap2_mandate at the earlier pin).
          interpretation: >
            Classified delegated because the authorization semantics
            belong to AP2, carried as a UCP extension, not a UCP-native
            operation.
        disputes: []

  settle:
    canonical_meaning: >
      Finalize a previously authorized payment. Move money from payer
      to payee. Distinct from charge only when a separate authorize
      step preceded it.
    mappings:
      x402_exact:
        status: bundled
        classification_by: contributor
        basis:
          source: "x402-foundation/x402@faa1c694 exact scheme, x402-specification-v2.md 7.2 POST /settle"
          observed: >
            The exact scheme settles once through POST /settle, which
            submits the on-chain transaction in the facilitator-submitted
            family.
          interpretation: >
            Classified bundled because charge and settle are the same
            operation; there is no distinct settle step after a separate
            charge.
        disputes: []
      x402_auth_capture:
        verb: capture
        status: mapped
        source: "x402-foundation/x402@faa1c694 specs/schemes/auth-capture/scheme_auth_capture.md, Lifecycle operations (capture)"
        note: >
          "Pays held funds out to the receiver", relayed as a /settle
          call with payload.type capture. Exists only in the escrow flow.
        disputes: []
      ap2:
        status: not_found
        source: "google-agentic-commerce/AP2@v0.2.0 (b4587ac1)"
        searched:
          - "specification.md, flows.md, mandate types @ v0.2.0 (b4587ac1): no settle operation"
        note: >
          AP2 self-describes as an authorization/mandate layer and
          delegates settlement to the merchant's payment processor; its
          spec defines no settle operation.
        disputes: []
      acp:
        status: delegated
        classification_by: contributor
        basis:
          source: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df completeCheckoutSession, order_create webhook"
          observed: >
            After completeCheckoutSession the merchant's PSP performs
            settlement; ACP receives confirmation through the
            order_create webhook.
          interpretation: >
            Classified delegated because settlement executes on the
            merchant PSP outside ACP's own surface; ACP observes the
            result, it does not settle.
        disputes: []
      mpp:
        status: bundled
        classification_by: contributor
        upstream_stability: draft
        reverify_by: 2027-01-13
        reverified_at: 2026-10-15
        basis:
          source: "tempoxyz/mpp-specs@782abaeb draft-httpauth-payment-01, Payment-Receipt header"
          observed: >
            The server settles upon verifying the Authorization: Payment
            credential and returns confirmation in the Payment-Receipt
            header.
          interpretation: >
            Classified bundled because settle occurs within the same
            exchange as charge, not as a separable step.
        disputes: []
      ucp:
        status: delegated
        classification_by: contributor
        basis:
          source: "Universal-Commerce-Protocol/ucp@v2026-08-25 (cd78fb38) complete_checkout, docs/specification/shopping/order/index.md Order Event Webhook"
          observed: >
            After complete_checkout the merchant payment handler settles;
            UCP receives order state through webhooks.
          interpretation: >
            Classified delegated because settlement runs on the merchant
            payment handler outside UCP's own surface.
        disputes: []

  refund:
    canonical_meaning: >
      Return funds to payer after settlement. Partial or full reversal
      of a completed charge.
    mappings:
      x402_exact:
        status: not_found
        source: "x402-foundation/x402@faa1c694 specs/schemes/exact/scheme_exact.md Payment Flow"
        searched:
          - "x402-foundation/x402@faa1c694: v2 spec exact scheme; facilitator API /settle, /verify, /supported: no refund operation, and the scheme text states this specification defines no refund"
        note: No refund mechanism in the exact scheme; settlement is final.
        disputes: []
      x402_auth_capture:
        verb: refund
        status: mapped
        source: "x402-foundation/x402@faa1c694 specs/schemes/auth-capture/scheme_auth_capture.md, Lifecycle operations (refund, also void and reclaim)"
        note: >
          Returns captured funds to the client until extra.refundDeadline,
          with resource-server consent. Also void (pre-capture release)
          and reclaim (client recovers its hold after captureDeadline,
          never relayed through the facilitator): three distinct reversal
          operations for different lifecycle states. refund exists in
          both the escrow and authorization flows.
        disputes: []
      ap2:
        status: not_found
        source: "google-agentic-commerce/AP2@v0.2.0 (b4587ac1)"
        searched:
          - "specification.md, flows.md, mandate types @ v0.2.0 (b4587ac1): no refund verb"
        note: >
          No refund verb. Disputes use the mandate and receipt chain as
          non-repudiable evidence; refund is a rail-layer concern.
        disputes: []
      acp:
        status: delegated
        classification_by: contributor
        basis:
          source: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df order_events webhook, adjustments[] type refund"
          observed: >
            Refunds appear in the order_events webhook as adjustments[]
            entries of type refund; there is no endpoint to initiate one,
            and the spec states refund semantics are out of scope.
          interpretation: >
            Classified delegated because ACP observes refunds as
            merchant-side webhook data and provides no initiation surface
            of its own.
        disputes: []
      mpp:
        status: not_found
        upstream_stability: draft
        reverify_by: 2027-01-13
        reverified_at: 2026-10-15
        source: "tempoxyz/mpp-specs@782abaeb draft-httpauth-payment-01, charge intent (main)"
        searched:
          - "tempoxyz/mpp-specs@782abaeb: draft-httpauth-payment-01 and draft-payment-intent-charge-00: the word refund does not occur in either"
        note: >
          The core draft and the charge intent define no refund
          mechanism. The core draft leaves verification and settlement
          procedures to payment method specifications and does not
          mention refunds. Some method drafts return funds on failed
          payments (for example nearintents refundTo). Those are not
          classified here.
        disputes: []
      ucp:
        status: delegated
        classification_by: contributor
        basis:
          source: "Universal-Commerce-Protocol/ucp@v2026-08-25 (cd78fb38) docs/specification/shopping/order/rest.md Conformance, permalink_url"
          observed: >
            Post-purchase modifications, including refunds, route to the
            business through permalink_url; there is no refund endpoint
            or MCP tool.
          interpretation: >
            Classified delegated because refund handling is directed to
            the merchant via permalink_url, outside UCP's own operation
            set.
        disputes: []

  query:
    canonical_meaning: >
      Check the current state of a payment or checkout session.
    mappings:
      x402_exact:
        status: not_found
        source: "x402-foundation/x402@faa1c694 exact scheme, x402-specification-v2.md sections 7 and 8, docs/core-concepts/facilitator.md"
        searched:
          - "x402-foundation/x402@faa1c694: facilitator API /verify (read-only pre-settlement check), /settle, /supported (capability discovery), /discovery/*: no post-settlement status query"
        note: >
          No post-settlement status query. POST /verify is a
          pre-settlement validity check, not a state query; GET
          /supported is capability discovery, not transaction status.
          A settlement_pending response carries the broadcast tx hash so
          callers reconcile on chain or retry /settle. That is not a
          query operation.
        disputes: []
      x402_auth_capture:
        status: not_found
        source: "x402-foundation/x402@faa1c694 auth-capture scheme, facilitator API"
        searched:
          - "x402-foundation/x402@faa1c694: lifecycle operations are /settle calls and no new facilitator endpoint is involved: no query endpoint for escrow state"
        note: >
          No query endpoint for escrow state. On-chain state is readable
          directly but not via the facilitator API.
        disputes: []
      ap2:
        status: not_found
        source: "google-agentic-commerce/AP2@v0.2.0 (b4587ac1)"
        searched:
          - "specification.md, flows.md, mandate types @ v0.2.0 (b4587ac1): no payment status query"
        note: No payment status query; mandate state is in the VC itself.
        disputes: []
      acp:
        verb: getCheckoutSession
        endpoint: "GET /checkout_sessions/{id}"
        mcp_tool: get_checkout_session
        status: mapped
        sync: true
        source: "agentic-commerce-protocol/agentic-commerce-protocol@7fdd78df 2026-04-17 OpenAPI, GET /checkout_sessions/{id}"
        note: Returns current checkout session state including payment status.
        disputes: []
      mpp:
        status: not_found
        upstream_stability: draft
        reverify_by: 2027-01-13
        reverified_at: 2026-10-15
        source: "tempoxyz/mpp-specs@782abaeb draft-httpauth-payment-01"
        searched:
          - "tempoxyz/mpp-specs@782abaeb: draft-httpauth-payment-01: no query operation, Payment-Receipt carries a method-specific reference only"
        note: >
          Stateless per-request protocol for the charge intent. No
          session ID to query; each 402 exchange is independent. The
          receipt's method-specific reference (tx hash, invoice id) is
          not a query surface.
        disputes: []
      ucp:
        verb: get_checkout / get_order
        endpoint: "GET /checkout-sessions/{id} / GET /orders/{id}"
        mcp_tool: get_checkout / get_order
        status: mapped
        sync: true
        source: "Universal-Commerce-Protocol/ucp@v2026-08-25 (cd78fb38) checkout + order specs (rest.md, mcp.md), GET /checkout-sessions/{id}, GET /orders/{id}"
        note: >
          Both checkout and order state are queryable. Richest status
          query surface of the five protocols.
        disputes: []

# ----------------------------------------------------------------------
# Implementations summary (per settlement verb)
# ----------------------------------------------------------------------
#
# Derived from the mapping cells above. Each verb lists the protocols
# that implement it under their native name, or the status token where
# no native verb exists (bundled, delegated, not_found). Shape mirrors
# the per-verb implementations maps in crosswalk/budget_reservation.yaml.

implementations:
  charge:
    x402_exact: settle
    x402_auth_capture: charge
    ap2: not_found
    acp: completeCheckoutSession
    mpp: bundled
    ucp: complete_checkout
  authorize:
    x402_exact: bundled
    x402_auth_capture: authorize
    ap2: "Sign Mandate (Payment Mandate)"
    acp: delegatePayment
    mpp: not_found
    ucp: delegated
  settle:
    x402_exact: bundled
    x402_auth_capture: capture
    ap2: not_found
    acp: delegated
    mpp: bundled
    ucp: delegated
  refund:
    x402_exact: not_found
    x402_auth_capture: refund
    ap2: not_found
    acp: delegated
    mpp: not_found
    ucp: delegated
  query:
    x402_exact: not_found
    x402_auth_capture: not_found
    ap2: not_found
    acp: getCheckoutSession
    mpp: not_found
    ucp: get_checkout / get_order

promotion_criteria:
  status: descriptive_only_pending_convergence
  requirements:
    - Two or more mapped protocols independently adopt the same settlement term or shared sub-spec in their own published materials.
    - An external standards body or cross-protocol group publishes a compatible settlement model independently of this crosswalk.
  exclusions:
    - Co-location within this crosswalk is not evidence of convergence.
    - A protocol adding an operation currently marked not_found or delegated changes the mapping but does not, by itself, support promotion. Upstream closure triggers reverification, not promotion.

# ----------------------------------------------------------------------
# Structural findings
# ----------------------------------------------------------------------

findings:
  - id: F1
    finding: >
      x402 auth-capture is the only column with a native verb for four
      of the five settlement operations (charge, authorize, settle,
      refund). Its query cell is not_found. Every other protocol or
      scheme has at least two not_found, bundled, or delegated
      operations. (Corrected 2026-10-15: the earlier text said all
      five, which the query row never supported.)

  - id: F2
    finding: >
      Refund is the largest gap. x402 exact, AP2, and MPP charge have
      no refund mechanism in the searched scope. ACP and UCP surface
      refund data in webhooks but provide no API to initiate one.

  - id: F3
    finding: >
      Authorize means structurally different things: on-chain escrow
      lock (x402), cryptographic mandate credential (AP2), scoped
      payment token (ACP). MPP has no authorize intent on main, and the
      spending-cap proposal in PR #226 was closed unmerged and is no
      longer cited here. A multi-rail agent treating these as
      equivalent will mishandle fund reservation.

  - id: F4
    finding: >
      ACP and UCP are structurally near-identical at the settlement
      layer (both: create session, complete, webhooks for order state).
      The difference is in authorization: ACP uses Allowance tokens,
      UCP can consume AP2 mandates.

  - id: F5
    finding: >
      MPP charge is the only fully stateless settlement protocol here.
      No session, no transaction ID to query after the fact. Every
      other protocol maintains state across the lifecycle.

# ----------------------------------------------------------------------
# Relationship to budget_reservation.yaml
# ----------------------------------------------------------------------
#
# budget_reservation.yaml defines the AUTHORIZATION layer verbs
# (reserve/commit/release/refund/query_budget/query_reservation) that
# sit ABOVE the settlement layer mapped here.
#
# Composition: a budget authority calls `reserve` (budget_reservation
# layer); if ALLOW, the agent calls `charge` or `authorize` (this
# payment_rail layer); the rail settles.
#
# The two crosswalks are complementary, not overlapping.

related_crosswalks:
  - file: budget_reservation.yaml
    relationship: >
      budget_reservation defines the authorization/enforcement layer
      above this settlement layer. reserve (budget) precedes charge
      (rail). The refund verb appears in both: budget_reservation.refund
      releases held budget; payment_rail.refund returns settled funds.
