# crosswalk/succession-receipts.yaml
#
# Succession Receipts, Authority-Handoff Receipt (AHR) v0.2
# (draft-sabey-succession-receipts-05) -> Agent Governance Vocabulary
#
# Mapped artifact: the Authority-Handoff Receipt only.
#   Internet-Draft read: https://www.ietf.org/archive/id/draft-sabey-succession-receipts-05.txt
#     sha256 e58d45cd2dda8ed89bb184d9ddd6a2da4e0885edc338af9b8c24aacd4e695e64
#     (45991 bytes, dated 23 September 2026), Sections 1 to 9 read in full.
#   Spec read: spec/authority-handoff-receipts.md in jsabes24/css-succession-receipts
#     @ 17ec7bcf9332548fb60ffeea3fe648b1bcf0517c (main, 2026-09-23T03:02:00Z)
#     sha256 b9f8c34978c5644a60e655fd65efc888f15bc4d32ce72fa6160a70b160c980c4,
#     Sections 1 to 3 and 5 to 9 read in full, Section 4 read where cited.
#   The draft says the complete member catalog is the AHR spec. Where the two
#   differ, both are quoted and the difference is an open question below.
#
# Out of scope for this file: the companion artifacts in the same repository
# (ledger export, capability credential, anchoring checkpoints, refusal
# digest, selective-disclosure receipts, precommitment atoms, seat
# evidence). The corpus vectors were listed, not opened.
#
# This is a third-party crosswalk drafted by aeoess (maintainer of this
# registry), not by the format's author. It is offered for the author to
# correct or confirm. Corrections to the native protocol reading are checked
# against the cited source and the canonical vocabulary before recalibration.

system:
  name: Succession Receipts (Authority-Handoff Receipt)
  short_name: Succession-Receipts
  home: https://github.com/jsabes24/css-succession-receipts
  spec: https://github.com/jsabes24/css-succession-receipts/blob/17ec7bcf9332548fb60ffeea3fe648b1bcf0517c/spec/authority-handoff-receipts.md
  spec_version: "AHR v0.2 (draft) and draft-sabey-succession-receipts-05 (Informational intent, individual submission)"
  repo: https://github.com/jsabes24/css-succession-receipts
  implementation: >
    Receipts are issued by the CSS engine, which the README describes as
    "proprietary software of Continuity Laboratories", as is the reference
    verifier sr-verify. The repository holds the specifications, the
    conformance corpus and the Internet-Drafts, and "deliberately contains
    no verifier or engine code".
  role: >
    "A Succession Receipt is a portable, signed JSON document that proves
    one completed, policy-gated transfer of authority between two agents:
    which agent held the authority, which agent holds it now, under what
    legitimacy determination the transfer ran, and which obligations
    carried forward, with every claim grounded in signed evidence events
    embedded in the receipt itself." Verified offline with the issuer's
    Ed25519 public key.
  identity_layer: >
    Stewards ("An agent (or agent generation) that can hold authority and
    carry obligations in the issuing system's registry") are named by UUID,
    each with an optional identity_id "bound at the predecessor's
    assignment" or the successor's. The issuer is a URN,
    "urn:css:registry" by default.
  upstream_license: "Repository LICENSE is Apache License 2.0. Internet-Draft text under the IETF Trust Legal Provisions (BCP 78)."
  ietf_status_note: >
    Individual Internet-Draft, work in progress. AHR v0.1 is frozen, v0.2
    is the current draft on a stated ladder toward 1.0.

license: Apache-2.0

maintainer:
  mapped_system_maintainer:
    github: jsabes24
    project: jsabes24/css-succession-receipts
    confirmed_at: null   # not yet reviewed by the mapped system's author
  crosswalk_contributor:
    github: aeoess
    author: Tymofii Pidlisnyi
  third_party_authored: true

# signature_capability: "ed25519 ([RFC8032], deterministic signatures) is
# the sole algorithm registered at spec versions 0.1 and 0.2." Post-quantum
# schemes are named as possible "additive prefixes registered by a new spec
# version".
# canonicalization: receipt canonical bytes are the JSON "with the proof
# member absent, object member names sorted lexicographically, no
# insignificant whitespace, and no HTML escaping", which "coincides with the
# JSON Canonicalization Scheme [RFC8785]" for the receipt's value domain.
# Evidence event hashes use a separate concatenation rule (draft Section
# 4.3) with the payload "in document member order", which is not JCS. The
# canonicalization_profile is left unset. Spec Section 3 requires UTF-8
# byte ordering, while RFC 8785 Section 3.2.3 requires UTF-16 code-unit
# ordering. Those differ for some Unicode member names, and Section 9
# permits unknown optional members covered by the proof. The upstream
# claim that the profiles coincide needs a declared restriction or
# clarification before this file can select jcs-rfc-8785.
# hash_family: SHA-256 for the receipt hash and every event_hash.
system_attributes:
  signature_capability: classical
  hash_family: sha-256

# Search basis for every no_mapping and false_analog row below: the two
# documents pinned above. A no_mapping row states that the named sources
# were searched and no corresponding field or record was found. It is not a
# claim about the project's capability outside those sources.

# ──────────────────────────────────────────────────────────────
# SIGNAL TYPE MAPPINGS
# ──────────────────────────────────────────────────────────────
signal_types:

  governance_attestation:
    canonical: governance_attestation
    internal: "Authority-Handoff Receipt (issuer proof over the claims and the embedded evidence)"
    match: partial
    notes: >
      A valid receipt attests that the issuing registry recorded "a
      succession that was proposed, validated, approved under a named
      legitimacy evaluation, and completed (the succession state machine
      permits no other path to Completed)", with the revocations,
      derivation and inheritance that went with it. That is a single-issuer
      signed statement that a transfer satisfied the issuer's governance
      gates, which overlaps the canonical definition.

      Partial, for three stated reasons. (1) The governance requirement is
      referenced, not carried: legitimacy.legitimacy_id and the optional
      legitimacy_state ("L3", "L4", "L5") name the evaluation, and the
      constitution claim binds the lineage by event hash, but the criteria
      applied are not in the receipt. (2) "A receipt proves what the issuer
      recorded, not that the issuer is honest." (3) It is scoped to the
      registry: "A receipt does not attest that anything outside the
      registry was enforced. CSS refusals gate ledger transitions, not
      external agent actions." The canonical term covers an agent or an
      action. Here the subject is a transfer of authority between stewards.
    issuers_in_production: []
    signed_payload_fields: []

  entity_continuity:
    canonical: entity_continuity
    internal: "predecessor and successor stewards in one succession"
    match: false_analog
    notes: >
      The canonical term answers "is this still the same agent?" across an
      infrastructure change. A Succession Receipt answers who holds an
      authority after it moved from one steward to another: "which agent
      held the authority, which agent holds it now". predecessor.steward_id
      and successor.steward_id name two stewards, and predecessor.replaced
      records a StewardReplaced event. The receipt carries authority
      continuity across a change of holder, not identity persistence.
      Recorded as false_analog because both concern an agent being
      "upgraded, replaced, suspended, and restored" and could be read as
      the same signal. Open question below on the identity_id fields.

  bilateral_receipt:
    canonical: bilateral_receipt
    internal: "receipt naming predecessor and successor stewards"
    match: false_analog
    notes: >
      The canonical term requires both parties' signatures over one
      canonicalized preimage. The receipt names two stewards and is signed
      by the issuer alone (a relying party "verifies a receipt offline with
      only the issuer's Ed25519 public key"). Embedded evidence events may
      carry an "optional signature", which is the platform's event
      signature, not a steward's. Recorded as false_analog because a
      two-party transfer record is close enough to be wired in as a
      two-party receipt.

  trust_verification:
    canonical: trust_verification
    match: no_mapping
    notes: "No verification status or grade about an agent in the search basis. legitimacy_state grades the evaluation behind a transfer, not the agent."

  behavioral_trust:
    canonical: behavioral_trust
    match: no_mapping
    notes: "No scored assessment of agent behavior in the search basis."

  cognitive_attestation:
    canonical: cognitive_attestation
    match: no_mapping
    notes: "No reasoning commitment in the AHR. The repository's seat evidence artifact concerns model output and is out of scope for this file."

  reasoning_integrity:
    canonical: reasoning_integrity
    match: no_mapping
    notes: "No attestation about an action's reasoning in the search basis."

  settlement_witness:
    canonical: settlement_witness
    match: no_mapping
    notes: "No settlement or payment outcome record in the search basis."

  peer_review:
    canonical: peer_review
    match: no_mapping
    notes: "No task-completion attestation by a delegating agent in the search basis."

  job_performance:
    canonical: job_performance
    match: no_mapping
    notes: "No outcome assessment of completed tasks in the search basis."

  completion_ratio:
    canonical: completion_ratio
    match: no_mapping
    notes: "No aggregate completion metric in the search basis."

  passport_grade:
    canonical: passport_grade
    match: no_mapping
    notes: "No graded standing for an agent in the search basis."

  security_posture:
    canonical: security_posture
    match: no_mapping
    notes: "No signed posture assessment of an artifact in the search basis."

  compliance_risk:
    canonical: compliance_risk
    match: no_mapping
    notes: "No scored exposure assessment in the search basis."

  wallet_state:
    canonical: wallet_state
    match: no_mapping
    notes: "No wallet or on-chain concept in the search basis."

  wallet_intelligence:
    canonical: wallet_intelligence
    match: no_mapping
    notes: "No wallet or on-chain concept in the search basis."

# ──────────────────────────────────────────────────────────────
# DECISION TRAJECTORY
# ──────────────────────────────────────────────────────────────
decision_trajectory:
  decision_lineage:
    canonical: decision_lineage
    internal: "evidence events (SuccessionProposed, SuccessionValidated, SuccessionApproved, SuccessionCompleted and correlated events)"
    match: false_analog
    notes: >
      The draft calls the evidence "the signed, hash-chained events the
      issuing system recorded". The canonical term is an "ordered
      content-addressable sequence of decisions affecting a single agent"
      in which "each entry references its predecessor by content hash".
      Within a receipt, each event_hash covers previous_event_id ("empty
      string when absent"), an identifier rather than the predecessor's
      hash, and the spec says the evidence is "a cross-stream subset: a
      receipt does not prove stream contiguity or completeness of the
      surrounding ledger". Entries are sorted by (timestamp, event_id) and
      concern two stewards. The ledger export, out of scope here, is
      described as replaying "the complete hash chain" and may be the
      closer candidate. Open question below.

  baseline_revision:
    canonical: baseline_revision
    match: no_mapping
    notes: "No behavioral baseline in the search basis."

  divergence_signal:
    canonical: divergence_signal
    match: no_mapping
    notes: "No measured behavioral deviation in the search basis."

  trust_velocity:
    canonical: trust_velocity
    match: no_mapping
    notes: "No trust score and no rate of change in the search basis."

# ──────────────────────────────────────────────────────────────
# DESCRIPTOR DIMENSIONS
# For the Authority-Handoff Receipt. Drafter's reading, each value with
# its basis, open to the author's correction.
# ──────────────────────────────────────────────────────────────
descriptor_dimensions:
  authority_handoff_receipt:
    enforcement_class: advisory
    note_enforcement: >
      The receipt refuses nothing. It is "the artifact an integrator,
      auditor, or counterparty checks before honoring a successor agent".
      The CSS engine refuses invalid transfers at the ledger, which the
      receipt reports after the fact and does not itself enforce.
    validity_temporal: at_issuance
    note_validity: >
      "A receipt is a statement about recorded history at validFrom; later
      constitutional events ... do not invalidate it". Consumers "MUST treat
      authority_status as of validFrom and check for newer successions when
      currency matters." There is no revocation of receipts.
    refusal_authority: consumer_policy
    note_refusal: "Whether to honor the successor is the relying party's decision. The receipt states no acceptance rule beyond verification."
    invariant_survival: post_action
    note_invariant: "Receipts exist only for completed successions: 'a proposed, rejected, or in-flight succession has no receipt.'"
    note_replay: >
      The proof, every event hash and the claim grounding in both
      directions are recomputable from the receipt and the issuer key. The
      legitimacy evaluation's inputs are referenced by ID and not carried,
      so full_replay is not claimed. replay_class is left unset while the
      registry clarifies the criteria for each value. Recomputing record
      integrity and claim grounding does not by itself establish that the
      legitimacy decision can be independently recomputed.
    note_action_class: >
      No governed_action_class declared. A transfer of the authority of
      record between agent generations does not fit delegate (authority is
      superseded and re-derived, not passed down a chain) and the vocabulary
      has no succession value. Listed as a gap below.

# ──────────────────────────────────────────────────────────────
# SUCCESSION-RECEIPT TERMS WITH NO CLEAN CANONICAL TARGET
# The nearest concept in vocabulary-lifecycle.yaml (INCUBATING,
# descriptive only) is given in brackets as a pointer, not a mapping.
# ──────────────────────────────────────────────────────────────
succession_receipts_specific_terms:
  succession: "'The governed process by which authority of record transfers from a predecessor steward to a successor steward. Only completed successions yield receipts.' No governed_action_class value fits. [delegated_authority, revocation]"
  steward: "'An agent (or agent generation) that can hold authority and carry obligations in the issuing system's registry.' [agent_identity]"
  revoked_authorities: "Every predecessor authority the completion superseded, each with a revocation_basis ('superseded by succession <id>'). [revocation]"
  derived_authority: "successor.authority_id with authority_scope verbatim from AuthorityGranted, bound to accountability_chain_id. authority_status is 'granted' (post-succession governance review open) or 'active' (AuthorityValidated on record). [delegated_authority, activation_condition]"
  legitimacy_evaluation: "legitimacy_id recorded by SuccessionApproved, optional legitimacy_state L3, L4 or L5. [approval, authorization_decision]"
  obligation_and_commitment_lineage: "obligations_carried and commitments_carried, sorted UUID lists of what the successor inherits. No vocabulary term covers inherited obligations."
  constitution: "v0.2: genesis_event_hash, amendments_ratified, amendment_head_hash, so a verifier sees 'by which constitution' the transfer was governed. [policy_version, evidence]"
  ledger_binding: "v0.2: height and event_hash of the final evidence event, the horizon for a completeness check against a ledger export or anchored checkpoint. [coverage_and_completeness]"
  claim_grounding_both_directions: "Every claim needs a matching evidence event, and every lineage effect in evidence must be declared, so 'a receipt can neither invent nor conceal an effect of the transfer'. [coverage_and_completeness, evidence]"
  authorization_binding: "Optional cross-format claim (caid, receipt_hash, format) binding the handoff to a pre-execution authorization receipt. Native verification failure, an unverified binding and a demonstrated mismatch are three distinct results. [approval, evidence_attestor]"
  key_id_label: "Issuer-managed label 'deliberately NOT derived from the key'. Rotation adds a mapping and MUST NOT invalidate issued receipts. [signing_key, verifier_trust_policy]"

# ──────────────────────────────────────────────────────────────
# OPEN QUESTIONS FOR THE FORMAT'S AUTHOR
# ──────────────────────────────────────────────────────────────
open_questions:
  - "The draft (Section 6) names EP-AUTHORIZATION-RECEIPT-v1 for the Trust Receipt and says EP-RECEIPT-v1 'MUST NOT dispatch to that verifier'. The AHR spec at 17ec7bc (Section 2.1) lists 'EP-RECEIPT-v1' and 'EP-QUORUM-v1' as the format values. Which governs, and will the spec be updated to match -05?"
  - "Can predecessor.identity_id and successor.identity_id be equal, for an upgrade of one agent rather than a replacement? If so, a receipt with equal identity_id values may be a partial entity_continuity fit and that row should change."
  - "Is the in-receipt evidence meant to be read as a chain? Each event_hash covers previous_event_id, not the predecessor's hash. Is the ledger export the intended answer for ordered lineage?"
  - "Is legitimacy_state (L3, L4, L5) defined in a public document? It decides whether the governance requirement can be named in this row or only referenced."
  - "Should a later file map the refusal digest separately? It records refused transitions, which no row here covers."
  - "Spec Section 3 sorts member names by UTF-8 bytes and allows a JCS library. RFC 8785 uses UTF-16 code units, which order U+E000 and U+10000 differently. Section 9 permits unknown optional members. Is the intended profile RFC 8785, or is there a member-name restriction that makes the declared byte ordering coincide with it?"
